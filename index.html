                    { icon: "⚙️", title: "ثوابت إعرابية سحرية (احفظها كاسمك)", text: "- <strong>نكرة + نكرة تصفها</strong> = نعت. (طالبٌ <u>مجتهدٌ</u>).\n- <strong>معرفة + معرفة تصفها</strong> = نعت. (الطالبُ <u>المجتهدُ</u>).\n- <strong>نكرة + معرفة</strong> = مضاف إليه. (كتاب <u>النحوِ</u>).\n- <strong>معرفة + نكرة</strong> = غالباً حال إذا بينت الهيئة (جاء الطالب <u>مسرعاً</u>).\n- <strong>أي ضمير متصل باسم</strong> = مضاف إليه (كتابـ<u>ـه</u>، قلمـ<u>ـنا</u>).\n- <strong>الضمائر (هـ، ك، ي، نا) إذا اتصلت بفعل</strong> = مفعول به (أعجبـ<u>ـني</u>، أكرمـ<u>ـه</u>)." },
                    { icon: "🚀", title: "كيف تستخرج المشتقات في ثوانٍ؟", text: "<strong>1. اسم الفاعل:</strong> ابحث عن كلمة ثاني حرف فيها ألف (فَـاْعل) مثل (كاتب)، أو كلمة تبدأ بـ (مـُـ) مضمومة ومكسور ما قبل آخرها (مُعَلِّـم).\n<strong>2. اسم المفعول:</strong> ابحث عن كلمة تبدأ بميم مفتوحة (مَـفْعول/مَـفْعَل) مثل (مَكتوب، مَبيع)، أو تبدأ بـ (مـُـ) مضمومة ومفتوح ما قبل آخرها (مُستخرَج).\n<strong>3. صيغ المبالغة:</strong> ابحث عن الأوزان (فَعّال، مِفعال، فَعول، فَعيل، فَعِل).\n<strong>4. الزمان والمكان:</strong> ابحث عن ميم مفتوحة (مَـفعَل/مَـفعِل) أو ميم مضمومة وفتح ما قبل الآخر." },

            {

                    { icon: "⚙️", title: "أولاً: من الثلاثي (على وزن مَفعُول)", text: "- الصحيح: كُتِب ⟸ مَكْتُوب / عُرِف ⟸ مَعْرُوف.\n- الأجوف (معتل الوسط بالواو أو الياء): نأتي بالمضارع ونقلب ياء المضارعة ميماً (مفتوحة). قيل/يقول ⟸ مَقُول / بيع/يبيع ⟸ مَبِيع. (ملاحظة: وزنها مَفَعِل أو مَفَعُل).\n- الناقص (معتل الآخر): نأتي بالمضارع ونضع ميماً (مفتوحة) ونشدد الحرف الأخير. دُعِي/يدعو ⟸ مَدْعُوّ / قُضِي/يقضي ⟸ مَقْضِيّ." },

            {
                id: 'L11', title: "11. تراكمي: المضاف إليه والمعطوف", type: 'lesson',
                sections: [
                    { icon: "📌", title: "المضاف إليه", text: "اسم يوضح الكلمة النكرة التي قبله ويُخصصها، وهو <strong>دائماً مجرور</strong>.\nصوره الثابتة:\n1. نكرة + معرفة = مضاف إليه (طالبُ <u>العلمِ</u>).\n2. نكرة + نكرة (لا تصفها) = مضاف إليه (بابُ <u>فصلٍ</u>).\n3. بعد الظروف غير المنونة (فوقَ <u>الشجرةِ</u>).\n4. بعد الكلمات: (كُل، بَعض، جَميع، غَير، سِوى، مُعظم، ذو).\n5. أي ضمير يتصل باسم يُعرب مضاف إليه (كتابـ<u>ـه</u>، قلمـ<u>ـنا</u>)." },
                    { icon: "⚙️", title: "المعطوف", text: "تابع يتبع ما قبله (المعطوف عليه) في الإعراب (رفعاً، ونصباً، وجراً)، ويتوسط بينهما حرف عطف.\nحروف العطف:\n- (الواو) للمشاركة / (الفاء) للترتيب والتعقيب / (ثُمّ) للترتيب والتراخي / (أو) للتخيير.\n- (لا) تُثبت الحكم لما قبلها وتنفيه عما بعدها (نجح المجتهدُ <u>لا</u> المتكاسلُ).\n- (بل / لكن) تنفي الحكم عما قبلها وتثبته لما بعدها (ما صاحبتُ الخائنَ <u>بل</u> الأمينَ)." },
                    { icon: "💎", title: "تركات الأستاذ طارق الامتحانية", text: "1. المضاف إليه لا يسبقه تنوين أبداً، ولا يسبقه نون المثنى أو جمع المذكر السالم (تحذف للإضافة). نقول: معلما المدرسةِ (وليس معلمان).\n2. (لكنْ) الساكنة النون حرف عطف. أما (لكنَّ) المشددة فهي من أخوات إن تنصب المبتدأ." }
                ],
                questions: [

                    { id: 'l11_q2', type: 'text', text: "أعرب (الطلاب): «جميع الطلاب ناجحون»:", correctAnswers: ["مضاف إليه مجرور", "مضاف اليه"] },
                    { id: 'l11_q3', type: 'mcq', text: "«طالب العلم مكرم». إعراب (العلم):", options: ["مضاف إليه", "نعت", "خبر"], correctAnswer: "مضاف إليه" },
                    { id: 'l11_q4', type: 'text', text: "أعرب الهاء في (قلمه):", correctAnswers: ["مضاف إليه", "مضاف اليه"] },

            {
                id: 'L12', title: "12. تراكمي: البدل", type: 'lesson',
                sections: [
                    { icon: "📌", title: "المفهوم", text: "تابع مقصود بالحكم بلا واسطة، يتبع المبدل منه في الإعراب." },
                    { icon: "⚙️", title: "أنواع البدل (3 أنواع)", text: "<strong>1. بدل مطابق (كل من كل):</strong>\n- لقب/وظيفة + اسم علم (الخليفة <u>عمر</u> / الدكتور <u>أحمد</u>).\n- اسم إشارة + كلمة بها (ال) (هذا <u>الطالب</u> / تلك <u>الفتاة</u>).\n- تفصيل بعد إجمال يطابقه (اهدنا الصراط المستقيم <u>صراط</u> الذين...).\n\n<strong>2. بدل بعض من كل:</strong>\nيكون البدل جزءاً مادياً (ملموساً) وحقيقياً من المبدل منه، ويجب أن يتصل به ضمير يعود على المبدل منه.\n- قرأتُ الكتابَ <u>نِصفَهُ</u> / سقطت الشجرةُ <u>فروعُها</u> / عالج الطبيب المريضَ <u>رأسَهُ</u>.\n\n<strong>3. بدل اشتمال:</strong>\nيكون البدل مما يشتمل عليه المبدل منه (شيء معنوي غالباً ليس جزءاً أساسياً)، ويتصل به ضمير.\n- أعجبني الطالبُ <u>أدبُهُ</u> / سمعتُ الشاعرَ <u>إنشادَهُ</u> / انتفعت بالقرآن <u>هديهِ</u>." },
                    { icon: "💎", title: "تركات الأستاذ طارق الامتحانية", text: "1. إذا سُبق اسم الإشارة بأداة نداء، فالاسم المعرف بـ(ال) بعده يُعرب <strong>نعتاً</strong> وليس بدلاً. (يا هذا <u>الطالبُ</u> ⟸ نعت مرفوع).\n2. إذا جُرد البدل (البعض من كل / الاشتمال) من الضمير ونُوّن، يُعرب <strong>تمييزاً</strong>. (أعجبني الطالبُ <u>أدباً</u> ⟸ تمييز).\n3. اسم إشارة + اسم نكرة = <strong>خبر</strong>. (هذا <u>طالبٌ</u>)." }
                ],
                questions: [
                    { id: 'l12_q1', type: 'mcq', text: "«أبهرني المعلم شرحه». (شرحه) بدل:", options: ["مطابق", "بعض من كل", "اشتمال"], correctAnswer: "اشتمال" },
                    { id: 'l12_q2', type: 'text', text: "«هذا الكتاب مفيد». أعرب (الكتاب):", correctAnswers: ["بدل مطابق مرفوع", "بدل مرفوع", "بدل"] },
                    { id: 'l12_q3', type: 'text', text: "«يا هذا الطالب». أعرب (الطالب):", correctAnswers: ["نعت مرفوع", "نعت"] },
                    { id: 'l12_q4', type: 'mcq', text: "«قرأت القصة نصفها». (نصفها) بدل:", options: ["اشتمال", "بعض من كل", "مطابق"], correctAnswer: "بعض من كل" },
                    { id: 'l12_q5', type: 'text', text: "استخرج البدل: «حكم الفاروق عمر بالعدل»:", correctAnswers: ["عمر"] },
                    { id: 'l12_q6', type: 'mcq', text: "«أعجبني المعلم خلقاً». (خلقاً) تُعرب:", options: ["بدل", "حال", "تمييز"], correctAnswer: "تمييز" },
                    { id: 'l12_q7', type: 'text', text: "أعرب (الرجل): «هذا رجل كريم»:", correctAnswers: ["خبر مرفوع", "خبر"] },
                    { id: 'l12_q8', type: 'text', text: "«أدهشتني الفتاة تفوقها». أعرب (تفوقها):", correctAnswers: ["بدل اشتمال مرفوع", "بدل مرفوع", "بدل"] },
                    { id: 'l12_q9', type: 'mcq', text: "البدل المطابق يسمى أيضاً:", options: ["بدل كل من كل", "بدل اشتمال"], correctAnswer: "بدل كل من كل" },
                    { id: 'l12_q10', type: 'text', text: "حول التمييز لبدل: «طابت الإسكندرية هواءً»:", correctAnswers: ["طابت الإسكندرية هواؤها", "طابت الاسكندرية هواؤها"] },
                    { id: 'l12_q11', type: 'text', text: "استخرج البدل: «تلك الشجرة مثمرة»:", correctAnswers: ["الشجرة"] },

                    { id: 'l12_q13', type: 'text', text: "أعرب (نصفه): «أكلت الرغيف نصفه»:", correctAnswers: ["بدل منصوب", "بدل بعض من كل منصوب"] },

                ]

            {
                id: 'L13', title: "13. تراكمي: المدح والذم", type: 'lesson',
                sections: [
                    { icon: "📌", title: "مكونات الأسلوب", text: "يتكون من: (فعل المدح/الذم + الفاعل + المخصوص بالمدح أو الذم)." },
                    { icon: "⚙️", title: "أولاً: (نِعْمَ) و (بِئْسَ)", text: "- <strong>للفاعل 4 صور:</strong> \n1. معرف بـ (ال): نعم <u>الخلقُ</u> الصدق.\n2. مضاف لمعرفة: نعم <u>خلقُ المرءِ</u> الصدق.\n3. اسم موصول (من/ما): نعم <u>ما</u> تتصف به الصدق / بئس <u>من</u> تصاحب الكاذب.\n4. ضمير مستتر يفسره تمييز نكرة منصوب: نعم <u>خلقاً</u> الصدق. (خلقاً: تمييز، والفاعل مستتر).\n\n- <strong>إعراب المخصوص:</strong> (الصدق) إما <strong>مبتدأ مؤخر جوازاً</strong>، أو <strong>خبر لمبتدأ محذوف</strong>." },
                    { icon: "🚀", title: "ثانياً: (حَبَّذَا) و (لا حَبَّذَا)", text: "- <strong>الفاعل:</strong> هنا هو دائماً اسم الإشارة <u>(ذا)</u> المتصل بها.\n- <strong>المخصوص:</strong> هنا يُعرب دائماً <strong>مبتدأ مؤخر وجوباً</strong>. \n- مثال: حبذا <u>الأمانةُ</u>. (لا يجوز تقديم الأمانة هنا)." },
                    { icon: "💎", title: "تركات الأستاذ طارق الامتحانية", text: "1. المخصوص مع (نعم/بئس) جائز التأخير (نعم الرجل أحمد = أحمد نعم الرجل). أما مع (حبذا) فهو <u>واجب التأخير</u> (لا يجوز: أحمد حبذا).\n2. الكلمة النكرة المنصوبة بعد نعم وبئس تُعرب (تمييزاً) والفاعل يكون مستتراً." }
                ],
                questions: [
                    { id: 'l13_q1', type: 'mcq', text: "«حبذا الصدق». إعراب الصدق:", options: ["فاعل", "مبتدأ مؤخر وجوباً", "مبتدأ مؤخر جوازاً"], correctAnswer: "مبتدأ مؤخر وجوباً" },
                    { id: 'l13_q2', type: 'text', text: "«نعم خلقاً الصدق». أعرب (خلقاً):", correctAnswers: ["تمييز منصوب", "تمييز"] },
                    { id: 'l13_q3', type: 'text', text: "استخرج الفاعل: «بئس من تصاحب الخائن»:", correctAnswers: ["من", "الاسم الموصول من"] },
                    { id: 'l13_q4', type: 'mcq', text: "تأخير المخصوص مع (بئس) حكمه:", options: ["واجب التأخير", "جائز التأخير"], correctAnswer: "جائز التأخير" },
                    { id: 'l13_q5', type: 'text', text: "أعرب (ذا) في كلمة (حبذا):", correctAnswers: ["اسم إشارة مبني في محل رفع فاعل", "فاعل"] },
                    { id: 'l13_q6', type: 'text', text: "«نعم العمل الإخلاص». أعرب الإخلاص:", correctAnswers: ["مبتدأ مؤخر أو خبر لمبتدأ محذوف", "مبتدأ مؤخر"] },
                    { id: 'l13_q7', type: 'mcq', text: "«بئس صفةً الغدر». الفاعل هنا:", options: ["صفةً", "ضمير مستتر", "الغدر"], correctAnswer: "ضمير مستتر" },
                    { id: 'l13_q8', type: 'text', text: "صوب الخطأ: «المنافقون لا حبذا»:", correctAnswers: ["لا حبذا المنافقون"] },
                    { id: 'l13_q9', type: 'text', text: "«نعم صاحب المرء الوفي». استخرج المخصوص:", correctAnswers: ["الوفي"] },
                    { id: 'l13_q10', type: 'mcq', text: "حكم تأخير المخصوص مع (حبذا):", options: ["واجب", "جائز"], correctAnswer: "واجب" },
                    { id: 'l13_q11', type: 'text', text: "أعرب (الغدر) في: «لا حبذا الغدر»:", correctAnswers: ["مبتدأ مؤخر وجوباً مرفوع", "مبتدأ مؤخر وجوبا", "مبتدأ مؤخر"] },
                    { id: 'l13_q12', type: 'mcq', text: "أفعال المدح والذم (نعم، بئس، حبذا):", options: ["أفعال ماضية جامدة", "أفعال متصرفة"], correctAnswer: "أفعال ماضية جامدة" },
                    { id: 'l13_q13', type: 'text', text: "اجعل (الكذب) مخصوصاً بالذم واجب التأخير:", correctAnswers: ["لا حبذا الكذب"] },
                    { id: 'l13_q14', type: 'text', text: "استخرج الفاعل: «نعم قولاً الصدق»:", correctAnswers: ["ضمير مستتر", "مستتر"] },
                    { id: 'l13_q15', type: 'text', text: "اجعل (الصدق) مخصوصاً جائز التأخير:", correctAnswers: ["نعم الخلق الصدق", "نعم القول الصدق"] }
                ]

            {
                id: 'L14', title: "14. تراكمي: الممنوع من الصرف", type: 'lesson',
                sections: [
                    { icon: "📌", title: "التعريف والإعراب", text: "<strong>الممنوع من الصرف:</strong> اسم معرب لا يُنوّن (لا يقبل التنوين).\n<strong>إعرابه:</strong> يُرفع بالضمة، يُنصب بالفتحة. <u>ويُجر بالفتحة نيابة عن الكسرة</u>.\n- متى يُجر بالكسرة؟ إذا اقترن بـ (ال) أو أُضيف لما بعده.\n(صليت في مساجدَ كثيرة ⟸ بالفتحة) / (صليت في المساجدِ ⟸ بالكسرة)." },
                    { icon: "⚙️", title: "أسباب المنع من الصرف", text: "<strong>أولاً: يمنع لعلة واحدة (سبب واحد):</strong>\n1. <u>صيغة منتهى الجموع:</u> كل جمع تكسير وسطه ألف، بعدها حرفان أو ثلاثة أوسطها ساكن (مساجد، مصابيح، مفاتيح، عصافير). *إذا كان أوسطها متحرك تُصرف (تلامِذَة، عباقِرَة).\n2. <u>مختوم بألف التأنيث المقصورة:</u> كبرى، صغرى، دنيا، سلمى.\n3. <u>مختوم بألف التأنيث الممدودة:</u> صحراء، علماء، عظماء، حمراء.\n\n<strong>ثانياً: الممنوع لعلتين (عَلَم + علة أخرى):</strong>\n1. عَلَم أعجمي (إبراهيم، باريس). 2. عَلَم مؤنث (فاطمة، سعاد، حمزة، مكة). 3. مركب مزجي (بورسعيد، بعلبك). 4. مختوم بألف ونون زائدتين (عثمان، مروان). 5. على وزن الفعل (أحمد، أشرف، يزيد). 6. على وزن فُعَل (عُمَر، زُحَل).\n\n<strong>ثالثاً: الممنوع لعلتين (صفة + علة أخرى):</strong>\n1. على وزن أَفْعَل (أكبر، أفضل، أحمر). 2. على وزن فَعْلان (عطشان، غضبان)." },

            { id: 'T2', title: "امتحان القطعة 2", type: 'test', passage: "«قال الأستاذ أحمد أمين: بلغني مرض صديقي، فلم أدركه إلا جنازة، فشيعته إلى أن أُنزل حفرته، ونُفضتْ من ترابه الأيدى، وعدتُ موجع القلب باكيًا مكروب النفس... وأنى كنت أقسو عليه وأنا رحيم به».", questions: [ { id: 't2_1', type: 'text', text: "إعراب «الأيدى»:", correctAnswers: ["نائب فاعل"] }, { id: 't2_2', type: 'text', text: "اسم فاعل وتفضيل:", correctAnswers: ["موجع اعمق"] }, { id: 't2_3', type: 'text', text: "فعل (مكروب):", correctAnswers: ["كرب", "كُرِبَ"] }, { id: 't2_4', type: 'text', text: "نوع (رحيم):", correctAnswers: ["صيغة مبالغة"] } ] },
            { id: 'T3', title: "امتحان القطعة 3", type: 'test', passage: "«نقول لأبواق الكذب، وملفقى التُّهم، وبائعي الأباطيل: إن شعب مصر فى حالة من الاصطفاف خلف قيادته، فهو لا يفرط فى مقدراته، ولا يقبل المساس بأمنه، فلا أغلى من وطن يعيش فى القلوب، والشدائد محك الرجال».", questions: [ { id: 't3_1', type: 'text', text: "أعرب المساس:", correctAnswers: ["مفعول به"] }, { id: 't3_2', type: 'mcq', text: "اسم الفاعل الثلاثى:", options: ["المساس", "بائعى"], correctAnswer: "بائعى" }, { id: 't3_3', type: 'text', text: "نوع المشتق (مفترق):", correctAnswers: ["اسم مكان"] } ] },
            { id: 'T4', title: "امتحان القطعة 4", type: 'test', passage: "«الطموح قيمة إيجابية تدفع الشباب إلى الإبداع والتميز، فهو مفتاح النجاح، ولتعلموا أن طريق المستقبل مليء بالتحديات والصعوبات، وعليكم أن تسلكوه متسلحين بالإرادة الحسنى».", questions: [ { id: 't4_1', type: 'text', text: "إعراب «متسلحين»:", correctAnswers: ["حال منصوب", "حال"] }, { id: 't4_2', type: 'text', text: "اسم آلة ونوعه:", correctAnswers: ["مفتاح قياسي", "مفتاح"] }, { id: 't4_3', type: 'text', text: "اسم تفضيل وفعله:", correctAnswers: ["الحسنى حسن", "الحسنى"] } ] },
            { id: 'T5', title: "امتحان القطعة 5", type: 'test', passage: "«ينبغى أن نكون على حذر من انتشار التنمر؛ لأنه من السلوكيات الهدامة فى المجتمع، فإن من يفعل ذلك ملوم؛ لما يسببه من أذى نفسى لغيره؛ فيجب علينا معاقبة المتنمر حتى لا نكون من الآثمين».", questions: [ { id: 't5_1', type: 'text', text: "إعراب «معاقبة»:", correctAnswers: ["فاعل"] }, { id: 't5_2', type: 'text', text: "مبالغة ووزنها:", correctAnswers: ["الهدامة فعالة", "الهدامة"] }, { id: 't5_3', type: 'mcq', text: "«ملوم» فعلها:", options: ["لام", "لِيم"], correctAnswer: "لِيم" } ] },
            { id: 'T6', title: "امتحان القطعة 6", type: 'test', passage: "«لا يهدم المحتل مهما كان معوله شعبًا محصنًا بالدين فلم يذل، وبالإرادة القوية فلم ينكسر، وبالأخلاق المميزة فلم يهن، فاضت نفوسهم بحب أرضهم».", questions: [ { id: 't6_1', type: 'text', text: "إعراب «شعبًا»:", correctAnswers: ["مفعول به"] }, { id: 't6_2', type: 'text', text: "اسم فاعل وآلة:", correctAnswers: ["المحتل معوله", "المحتل"] } ] },
            { id: 'T7', title: "امتحان القطعة 7", type: 'test', passage: "«لن يتقدم الوطن إلا إذا كان أبناؤه متحدين، وحذرين من الشائعات، خططهم مدروسة وفعَّالة تنفذ على أرض الواقع، لا يلتفتون إلى قول حاقد، ولا لمعاول الهدم».", questions: [ { id: 't7_1', type: 'text', text: "إعراب «متحدين»:", correctAnswers: ["خبر كان"] }, { id: 't7_2', type: 'text', text: "اسم فاعل لثلاثي:", correctAnswers: ["حاقد"] }, { id: 't7_3', type: 'mcq', text: "«مدروسة» نوعه:", options: ["فاعل", "مفعول", "آلة"], correctAnswer: "اسم مفعول" } ] },
            { id: 'T8', title: "امتحان القطعة 8", type: 'test', passage: "«شكلت المبادرات الرئاسية نقطة فارقة ومضيئة داخل المجتمع... والاستثمار فى رأس المال البشرى؛ إيمانًا بأن التنمية الاجتماعية... لا يمكن الوصول إليها...».", questions: [ { id: 't8_1', type: 'text', text: "إعراب «إيمانًا»:", correctAnswers: ["مفعول لأجله"] }, { id: 't8_2', type: 'text', text: "صيغة مبالغة ومكان:", correctAnswers: ["بناءة المجتمع", "المجتمع"] } ] },
            { id: 'T9', title: "امتحان القطعة 9", type: 'test', passage: "«الأنانية والطمع صورتان من صور الشر؛ لانهما صفتان مدمرتان للإنسان... فلا بد أن نكون حذرين بنبذ تلك الصفات، فالإنسان الحذر محبوب من جميع أفراد المجتمع».", questions: [ { id: 't9_1', type: 'text', text: "أعرب «صورتان»:", correctAnswers: ["خبر"] }, { id: 't9_2', type: 'text', text: "اسم فاعل وفعله:", correctAnswers: ["مدمرتان دمر", "مدمرتان"] }, { id: 't9_3', type: 'mcq', text: "(المبرد) نوعه:", options: ["مبالغة", "اسم آلة"], correctAnswer: "اسم آلة" } ] },
            { id: 'T10', title: "امتحان القطعة 10", type: 'test', passage: "«فى بستان العمر أزهار كثيرة تُهَوِّن علينا مشقات الحياة، وأروعها الأولاد، وخصوصًا البارين منهم... والجمال كل الجمال أن نصبح جميعًا حمادين فضل أمنا مصر».", questions: [ { id: 't10_1', type: 'text', text: "إعراب «مشقات»:", correctAnswers: ["مفعول به"] }, { id: 't10_2', type: 'text', text: "تفضيل وفعله:", correctAnswers: ["أروع روع", "اروع"] }, { id: 't10_3', type: 'mcq', text: "(حمادين):", options: ["اسم فاعل", "صيغة مبالغة"], correctAnswer: "صيغة مبالغة" } ] },
            { id: 'T11', title: "امتحان القطعة 11", type: 'test', passage: "«ليس هناك أدل على أهمية اللغة العربية من تلك الرغبة المتزايدة فى تعلمها... ذلك الإقبال الذى لا تستطيع المدارس والهيئات التعليمية القيام به وحدها».", questions: [ { id: 't11_1', type: 'text', text: "إعراب «القيام»:", correctAnswers: ["مفعول به"] }, { id: 't11_2', type: 'text', text: "اسم تفضيل:", correctAnswers: ["ادل"] }, { id: 't11_3', type: 'mcq', text: "(المصيدة):", options: ["مكان", "آلة"], correctAnswer: "اسم آلة" } ] },
            { id: 'T12', title: "امتحان القطعة 12", type: 'test', passage: "«إن مصادر الطاقة فى وطننا العربى هدف مُلحٌّ للغرب الذى يحاول الاستيلاء عليها بالقوة والادعاء الكاذب، فعلى العرب أن ينتبهوا... فى مواجهة عدوهم المغرور».", questions: [ { id: 't12_1', type: 'text', text: "إعراب «هدف»:", correctAnswers: ["خبر إن", "خبر ان"] }, { id: 't12_2', type: 'text', text: "اسم فاعل واسم مكان:", correctAnswers: ["ملح مصادر", "ملح"] } ] },
            { id: 'T13', title: "امتحان القطعة 13", type: 'test', passage: "«التعليم فى الدول المتقدمة عالٍ شأنه، منظمة مؤسساته... كما يقوم على خطط ورؤية أشمل تتسم بالواقعية، وهذا ما تسعى إليه مصرنا الحبيبة... وحمل مشعل التنمية».", questions: [ { id: 't13_1', type: 'text', text: "إعراب «شأنه»:", correctAnswers: ["فاعل"] }, { id: 't13_2', type: 'text', text: "اسم تفضيل وآلة:", correctAnswers: ["اشمل مشعل", "اشمل"] } ] },
            { id: 'T14', title: "امتحان القطعة 14", type: 'test', passage: "«بنى مصر سيروا على بركة الله، واعملوا مخلصين على أن تتسلحوا بالعلم؛ فالعلم هو مفتاح النهضة، ولا تظنوا الطريق ممهدة، ولكن يجب عليكم الكفاح».", questions: [ { id: 't14_1', type: 'text', text: "إعراب «بنى»:", correctAnswers: ["منادى"] }, { id: 't14_2', type: 'text', text: "إعراب «الكفاح»:", correctAnswers: ["فاعل"] }, { id: 't14_3', type: 'mcq', text: "«مفتاح»:", options: ["سماعي", "قياسي"], correctAnswer: "قياسي" } ] },
            { id: 'T15', title: "امتحان القطعة 15", type: 'test', passage: "«أنعم الله على مصر بموقع متميز جعلها ملتقى الحضارات، ومنح شعبها أجمل الصفات، ووهبها نيلًا عظيمًا، على ضفافه عاش شعبها حياة مسالمة يميزها الأمن».", questions: [ { id: 't15_1', type: 'text', text: "إعراب «أجمل»:", correctAnswers: ["مفعول به ثان", "مفعول به"] }, { id: 't15_2', type: 'mcq', text: "(ملتقى):", options: ["مكان", "مفعول"], correctAnswer: "اسم مفعول" } ] },
            { id: 'T16', title: "امتحان القطعة 16", type: 'test', passage: "«أى بنى إذا أردت الوصول إلى قمة المجد فيجب أن تكون راقيًا فى فكرك، ألوفًا فى معاملتك، مهذبًا فى سلوكك، وليكن الكتاب مفتاحًا لخزائن العلم، ولتجعل القلم سلاحًا».", questions: [ { id: 't16_1', type: 'text', text: "إعراب «بنى»:", correctAnswers: ["منادى"] }, { id: 't16_2', type: 'text', text: "اسم آلة قياسي:", correctAnswers: ["مفتاح"] } ] },
            { id: 'T17', title: "امتحان القطعة 17", type: 'test', passage: "«الأمن والأمان خير نعم الحياة، فكن واعيًا لأهميتهما، مقدرًا خطر فقدانهما، ولن يتحقق الأمن إلا بإخلاصك لوطنك، وينبغى لكل محب لهذا الوطن العمل لرفعته».", questions: [ { id: 't17_1', type: 'text', text: "إعراب «العمل»:", correctAnswers: ["فاعل"] }, { id: 't17_2', type: 'text', text: "اسم تفضيل:", correctAnswers: ["خير"] } ] },
            { id: 'T18', title: "امتحان القطعة 18", type: 'test', passage: "«بالسعى والعمل تحقق الخيرات، فاسعَ تحقق أحلامك، واجعل مصباحك الاجتهاد، فالكسول غير مرغوب فيه، فلا تكن منشارًا للكسل فى مجتمع يحلم بمستقبل أفضل».", questions: [ { id: 't18_1', type: 'text', text: "إعراب «أفضل»:", correctAnswers: ["نعت"] }, { id: 't18_2', type: 'text', text: "اسم آلة وفاعل:", correctAnswers: ["مصباح ساع", "مصباح"] } ] },
            { id: 'T19', title: "القاهرة (شامل)", type: 'test', passage: "«أسهم في زراعة شجرة يستظل بظلها الناس، ويأكلون من ثمرها، وتتجمل البيئة بها، وتسهم في تلطيف حرارة الجو؛ فالإكثار من زراعة الأماكن الخضراء له ثماره العظيمة؛ لذا نحن مدعوون لهذا العمل المفيد».", questions: [ { id: 't19_1', type: 'text', text: "إعراب «الناس»:", correctAnswers: ["فاعل"] }, { id: 't19_2', type: 'mcq', text: "(مذياع) للخير:", options: ["آلة", "مبالغة"], correctAnswer: "صيغة مبالغة" } ] },
            { id: 'T20', title: "الإسكندرية (شامل)", type: 'test', passage: "«إن الحب بين الناس مقياس للرقى، والشعب الذى يعيش بغير حب شعب متخلف الإحساس والمجتمع المشهود له بالحب هو أصل الحياة الرائعة، وهو أسعد من أمة تمزقها العداوة والبغضاء».", questions: [ { id: 't20_1', type: 'text', text: "إعراب «مقياس»:", correctAnswers: ["خبر إن", "خبر ان"] }, { id: 't20_2', type: 'text', text: "اسم آلة وتفضيل:", correctAnswers: ["مقياس اسعد", "مقياس"] } ] }
        ];

        // دمج كافة البيانات
        const allAppData = [...grammarLessons, ...megaBanks, ...grammarTests];

        const App = () => {
            // ================= State Management =================
            const [view, setView] = useState('auth'); // auth | dashboard | lesson_detail | quiz | result | teacher
            const [authMode, setAuthMode] = useState('login'); // login | register
            const [currentUser, setCurrentUser] = useState(null); // { id, name, phone, parentPhone, class }
            
            // Auth Form State
            const [phone, setPhone] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [studentClass, setStudentClass] = useState('');
            const [parentPhone, setParentPhone] = useState('');
            
            // Quiz State
            const [selectedId, setSelectedId] = useState(null);
            const [answers, setAnswers] = useState({});
            const [lockedAnswers, setLockedAnswers] = useState({});
            const [studentEvaluation, setStudentEvaluation] = useState(null); 
            
            // Data State
            const [usersDb, setUsersDb] = useState([]);
            const [resultsDb, setResultsDb] = useState([]);
            
            // UI State
            const [activeTab, setActiveTab] = useState('lessons');
            const [selectedStudentId, setSelectedStudentId] = useState(null);

            const currentItem = selectedId ? allAppData.find(t => t.id === selectedId) : null;

            // Load Data on mount
            useEffect(() => {
                const savedUsers = localStorage.getItem('tarek_users');
                if (savedUsers) setUsersDb(JSON.parse(savedUsers));
                
                const savedResults = localStorage.getItem('tarek_results');
                if (savedResults) setResultsDb(JSON.parse(savedResults));
            }, []);

            // ================= Helpers =================
            const normalizeArabic = (t) => !t ? "" : t.replace(/[\u064B-\u065F\u0670]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ـ/g, "").trim();

            const getCompletedIdsForUser = (userId) => {
                return [...new Set(resultsDb.filter(r => r.userId === userId).map(r => r.testId))];
            };

            const getStudentStats = (userId) => {
                const userResults = resultsDb.filter(r => r.userId === userId);
                if (userResults.length === 0) return { avgScore: 0, lessonsCount: 0, examsCount: 0, total: 0 };
                const avgScore = (userResults.reduce((acc, curr) => acc + curr.score, 0) / userResults.length).toFixed(1);
                const lessonsCount = userResults.filter(t => t.type === 'lesson').length;
                const examsCount = userResults.filter(t => t.type === 'test').length;
                return { avgScore, lessonsCount, examsCount, total: userResults.length, results: userResults };
            };

            // ================= Handlers =================
            const handleRegister = () => {
                if(!name || !phone || !password || !studentClass || !parentPhone) {
                    alert("برجاء إكمال جميع البيانات"); return;
                }
                if(usersDb.find(u => u.phone === phone)) {
                    alert("رقم الهاتف مسجل مسبقاً! قم بتسجيل الدخول."); return;
                }
                const newUser = { id: Date.now().toString(), name, phone, password, class: studentClass, parentPhone, role: 'student' };
                const updatedUsers = [...usersDb, newUser];
                setUsersDb(updatedUsers);
                localStorage.setItem('tarek_users', JSON.stringify(updatedUsers));
                setCurrentUser(newUser);
                setView('dashboard');
                // Reset form
                setPhone(''); setPassword(''); setName(''); setStudentClass(''); setParentPhone('');
            };

            const handleLogin = () => {
                if(!phone || !password) { alert("أدخل رقم الهاتف وكلمة المرور"); return; }
                const user = usersDb.find(u => u.phone === phone && u.password === password);
                if (user) {
                    setCurrentUser(user);
                    setView('dashboard');
                    setPhone(''); setPassword('');
                } else {
                    alert("بيانات الدخول غير صحيحة!");
                }
            };

            const handleTeacherLogin = () => {
                const pass = prompt("أدخل كلمة مرور المعلم السرية:");
                if (pass === 'tarek tarek') {
                    setView('teacher');
                } else {
                    alert('كلمة المرور خاطئة! غير مصرح بالدخول.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('auth');
            };

            const handleLockAnswer = (qId) => {
                if (!answers[qId] || answers[qId].trim() === '') {
                    alert("برجاء إدخال إجابة قبل التأكيد."); return;
                }
                setLockedAnswers(prev => ({ ...prev, [qId]: true }));
            };

            const handleSubmitQuiz = () => {
                let correctCount = 0;
                const feedback = currentItem.questions.map(q => {
                    const ans = (answers[q.id] || "").trim();
                    let isCorrect = false;
                    let correctDisplay = "";
                    if (q.type === 'mcq') {
                        isCorrect = (ans === q.correctAnswer);
                        correctDisplay = q.correctAnswer;
                    } else {
                        isCorrect = q.correctAnswers.some(k => normalizeArabic(ans).includes(normalizeArabic(k)));
                        correctDisplay = q.correctAnswers[0]; 
                    }
                    if (isCorrect) correctCount++;
                    return { text: q.text, studentAnswer: ans || "لم يجب", isCorrect, correctAnswer: correctDisplay };
                });

                const score = Math.round((correctCount / currentItem.questions.length) * 10);
                const evalResult = { score, feedback, generalComment: score >= 8 ? "ممتاز يا بطل، أنت فخر للأستاذ طارق!" : score >= 5 ? "جيد، ولكنك تستطيع الأفضل." : "تحتاج إلى مراجعة القاعدة بتركيز أكثر." };

                const resultData = { 
                    id: Date.now().toString(), 
                    userId: currentUser.id,
                    testId: currentItem.id,
                    testTitle: currentItem.title, 
                    score, 
                    feedback, 
                    timestamp: new Date().toISOString(), 
                    type: currentItem.type 
                };
                
                const newResults = [...resultsDb, resultData];
                setResultsDb(newResults);
                localStorage.setItem('tarek_results', JSON.stringify(newResults));

                setStudentEvaluation(evalResult);
                setView('result');
            };

            const sendWhatsApp = () => {
                const msg = `أهلاً أستاذ طارق،\nأنا الطالب: ${currentUser.name}\nالفصل: ${currentUser.class}\nرقمي: ${currentUser.phone}\nرقم ولي الأمر: ${currentUser.parentPhone}\nلقد أنهيت (${currentItem.title}) وحصلت على درجة: ${studentEvaluation.score}/10`;
                const whatsappUrl = `https://wa.me/${TEACHER_WHATSAPP}?text=${encodeURIComponent(msg)}`;
                window.open(whatsappUrl, '_blank');
            };

            // ================= Views =================

            if (view === 'auth') return (
                <div className="min-h-screen hero-gradient flex items-center justify-center p-4">
                    <div className="glass-card p-10 md:p-14 rounded-[3rem] w-full max-w-xl text-center relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-500 rounded-bl-full opacity-10"></div>
                        <div className="text-7xl mb-6 relative z-10 drop-shadow-2xl">👑</div>
                        <h1 className="text-4xl font-black text-indigo-900 mb-3 relative z-10">موسوعة أ. طارق</h1>
                        <p className="text-indigo-700 mb-10 font-bold text-sm relative z-10">الكتاب التفاعلي والتدريبات النحوية الشاملة</p>
                        
                        <div className="flex bg-slate-100 rounded-2xl p-2 mb-8 relative z-10">
                            <button onClick={() => setAuthMode('login')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${authMode === 'login' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>تسجيل الدخول</button>
                            <button onClick={() => setAuthMode('register')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${authMode === 'register' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500'}`}>حساب جديد</button>
                        </div>

                                <input type="password" placeholder="كلمة المرور" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-4 rounded-2xl border-none bg-slate-50/80 outline-none focus:ring-4 focus:ring-indigo-300 text-center font-black text-lg transition-all shadow-inner"/>
                                <button onClick={handleLogin} className="w-full py-5 bg-indigo-700 text-white rounded-2xl font-black text-2xl hover:bg-indigo-800 shadow-2xl hover:-translate-y-1 transition-all">دخول 🚀</button>
                            </div>
                        ) : (
                            <div className="space-y-4 relative z-10">
                                <input type="text" placeholder="الاسم الثلاثي للطالب" value={name} onChange={e => setName(e.target.value)} className="w-full p-4 rounded-2xl border-none bg-slate-50/80 outline-none focus:ring-4 focus:ring-indigo-300 text-center font-black text-sm transition-all shadow-inner"/>

                                <div className="flex gap-4">
                                    <input type="tel" placeholder="رقم الطالب" value={phone} onChange={e => setPhone(e.target.value)} className="w-full p-4 rounded-2xl border-none bg-slate-50/80 outline-none focus:ring-4 focus:ring-indigo-300 text-center font-black text-sm transition-all shadow-inner"/>
                                    <input type="tel" placeholder="رقم ولي الأمر" value={parentPhone} onChange={e => setParentPhone(e.target.value)} className="w-full p-4 rounded-2xl border-none bg-slate-50/80 outline-none focus:ring-4 focus:ring-indigo-300 text-center font-black text-sm transition-all shadow-inner"/>
                                </div>
                                <input type="password" placeholder="اختر كلمة مرور" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-4 rounded-2xl border-none bg-slate-50/80 outline-none focus:ring-4 focus:ring-indigo-300 text-center font-black text-sm transition-all shadow-inner"/>
                                <button onClick={handleRegister} className="w-full py-4 mt-2 bg-emerald-600 text-white rounded-2xl font-black text-xl hover:bg-emerald-700 shadow-xl hover:-translate-y-1 transition-all">إنشاء حساب وبدء الحل</button>
                            </div>
                        )}
                        
                        <div className="mt-12 pt-6 border-t-2 border-indigo-100/30 relative z-10">
                            <button onClick={handleTeacherLogin} className="w-full py-3 bg-slate-800 text-white rounded-xl font-bold text-sm hover:bg-slate-900 transition-colors shadow-lg">دخول الأستاذ طارق (لوحة المعلم) 🔒</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'dashboard' && currentUser) {
                const userCompletedIds = getCompletedIdsForUser(currentUser.id);
                return (
                    <div className="min-h-screen bg-slate-100 p-4 md:p-10">
                        <div className="max-w-7xl mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-center mb-10 bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl border-b-8 border-indigo-600 gap-6">
                                <div className="text-center md:text-right">
                                    <h2 className="text-4xl font-black text-indigo-950 mb-3 tracking-tight">أهلاً بك، {currentUser.name} 👋</h2>
                                    <p className="text-slate-600 font-bold text-lg">اختر القسم الذي تريد دراسته (المهام المكتملة يظهر بجوارها ✅)</p>
                                </div>
                                <button onClick={handleLogout} className="bg-rose-50 text-rose-600 px-8 py-4 font-black rounded-2xl hover:bg-rose-100 transition-all text-base shadow-sm">تسجيل خروج 🚪</button>
                            </div>

                            {/* Tabs */}
                            <div className="flex flex-col md:flex-row gap-4 mb-12 bg-white p-3 rounded-[2rem] shadow-lg border-2 border-slate-100">
                                <button onClick={() => setActiveTab('lessons')} className={`flex-1 py-5 rounded-3xl font-black text-xl transition-all ${activeTab === 'lessons' ? 'bg-indigo-600 text-white shadow-xl transform scale-[1.02]' : 'text-slate-500 hover:bg-indigo-50 hover:text-indigo-700'}`}>📚 1. موسوعة الدروس (شرح وتدريب)</button>
                                <button onClick={() => setActiveTab('mega_drills')} className={`flex-1 py-5 rounded-3xl font-black text-xl transition-all ${activeTab === 'mega_drills' ? 'bg-amber-500 text-white shadow-xl transform scale-[1.02]' : 'text-slate-500 hover:bg-amber-50 hover:text-amber-600'}`}>🔥 2. بنك الأسئلة الشامل (مكثف)</button>
                                <button onClick={() => setActiveTab('tests')} className={`flex-1 py-5 rounded-3xl font-black text-xl transition-all ${activeTab === 'tests' ? 'bg-emerald-600 text-white shadow-xl transform scale-[1.02]' : 'text-slate-500 hover:bg-emerald-50 hover:text-emerald-700'}`}>📝 3. امتحانات المحافظات</button>
                            </div>

                            {activeTab === 'lessons' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {grammarLessons.map(l => {
                                        const done = userCompletedIds.includes(l.id);
                                        return (
                                            <button key={l.id} onClick={() => { setSelectedId(l.id); setView('lesson_detail'); }} className={`bg-white p-8 rounded-[2.5rem] shadow-xl text-right border-b-8 transition-all relative group ${done ? 'border-emerald-500 bg-emerald-50/30' : 'border-indigo-600 hover:border-indigo-500 hover:shadow-2xl hover:-translate-y-2'}`}>
                                                {done && <span className="absolute top-6 left-6 bg-emerald-100 text-emerald-800 px-4 py-2 rounded-xl font-black text-xs shadow-sm border border-emerald-200">تم التدريب ✅</span>}
                                                <div className="bg-indigo-50 w-20 h-20 rounded-3xl flex items-center justify-center mb-6 text-4xl group-hover:bg-indigo-600 transition-colors group-hover:text-white shadow-inner">{l.id === 'L0' ? '💡' : '📖'}</div>
                                                <h3 className="font-black text-3xl text-slate-800 mb-4">{l.title}</h3>
                                                <p className="text-slate-600 text-base font-bold leading-relaxed">اقرأ الشرح الدقيق للدرس واختبر نفسك بـ <span className="text-indigo-600">{l.questions.length} سؤال</span>.</p>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}

                            {activeTab === 'mega_drills' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    <div className="col-span-full gold-gradient p-10 rounded-[3rem] mb-6 shadow-2xl text-white">
                                        <h3 className="text-4xl font-black mb-4">بنك الأستاذ طارق المركزي 💡</h3>
                                        <p className="font-bold text-xl opacity-90 leading-relaxed">هذا القسم يحتوي على 50 سؤالاً مركزاً يغطي كافة تفاصيل وأفكار المنهج بالكامل.</p>
                                    </div>
                                    {megaBanks.map(t => {
                                        const done = userCompletedIds.includes(t.id);
                                        return (
                                            <button key={t.id} onClick={() => { setSelectedId(t.id); setAnswers({}); setLockedAnswers({}); setView('quiz'); }} className={`bg-white p-8 rounded-[2.5rem] shadow-xl text-right border-b-8 transition-all relative group ${done ? 'border-emerald-500 bg-emerald-50/30' : 'border-amber-500 hover:border-amber-400 hover:shadow-2xl hover:-translate-y-2'}`}>

                                                <h3 className="font-black text-2xl text-slate-800 mb-4">{t.title}</h3>
                                                <p className="text-slate-600 text-base font-bold leading-relaxed">{t.passage}</p>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}

                            {activeTab === 'tests' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {grammarTests.map(t => {
                                        const done = userCompletedIds.includes(t.id);
                                        return (
                                            <button key={t.id} onClick={() => { setSelectedId(t.id); setAnswers({}); setLockedAnswers({}); setView('quiz'); }} className={`bg-white p-8 rounded-[2.5rem] shadow-xl text-right border-b-8 transition-all relative ${done ? 'border-emerald-500 bg-emerald-50/30' : 'border-emerald-600 hover:border-emerald-500 hover:shadow-2xl hover:-translate-y-2'}`}>

                                                <p className="text-slate-600 text-sm line-clamp-4 leading-loose font-bold bg-slate-50 p-5 rounded-2xl shadow-inner">{t.passage}</p>

                        <div className="p-8 md:p-14">

                                <span className="w-3 h-12 bg-indigo-600 rounded-full"></span>

                                        <div className={`absolute top-0 right-0 w-3 h-full ${idx === 3 || sec.title.includes('تركات') || sec.title.includes('القاعدة') ? 'bg-amber-500' : 'bg-indigo-600'}`}></div>

                                            <span className="text-4xl bg-slate-50 p-3 rounded-2xl shadow-inner">{sec.icon}</span> {sec.title}
                                        </h4>
                                        <p className={`text-xl leading-[2.5] font-bold whitespace-pre-wrap pl-4 ${sec.title.includes('تركات') || sec.title.includes('القاعدة') ? 'text-amber-900 tarek-trick p-6 rounded-2xl' : 'text-slate-700'}`} dangerouslySetInnerHTML={{__html: sec.text.replace(/\n/g, '<br/>')}}></p>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="gold-gradient p-12 md:p-16 rounded-[3rem] text-center shadow-2xl relative overflow-hidden text-white">
                                <div className="absolute -top-10 -left-10 text-[200px] opacity-10">🚀</div>
                                <div className="text-8xl mb-6 relative z-10 drop-shadow-xl">💪</div>
                                <h3 className="text-5xl font-black mb-6 relative z-10">حان وقت التطبيق يا بطل!</h3>
                                <p className="text-2xl font-bold mb-12 relative z-10 opacity-90">أثبت فهمك للقاعدة بحل ({currentItem.questions.length}) سؤالاً صُممت خصيصاً لك.</p>
                                <button onClick={() => { setAnswers({}); setLockedAnswers({}); setView('quiz'); }} className="bg-white text-amber-600 px-14 py-6 rounded-3xl font-black text-3xl shadow-2xl hover:bg-slate-50 hover:-translate-y-2 transition-all w-full md:w-auto relative z-10">ابدأ التدريب الآن 🚀</button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            if (view === 'quiz' && currentItem) {
                const allDone = currentItem.questions.every(q => lockedAnswers[q.id]);
                return (
                    <div className="min-h-screen bg-slate-100 p-4 md:p-10">
                        <div className="max-w-5xl mx-auto bg-white rounded-[3rem] shadow-2xl overflow-hidden border-2 border-indigo-100">
                            <div className="bg-slate-900 p-8 md:p-10 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <h1 className="text-3xl font-black mb-3 text-indigo-300">{currentItem.type === 'lesson' ? 'تدريب: ' : currentItem.type === 'test' ? 'امتحان: ' : ''}{currentItem.title}</h1>
                                    <p className="text-slate-400 text-lg font-bold">تأكيد وقفل كل سؤال إلزامي قبل التسليم</p>
                                </div>
                                <button onClick={() => setView(currentItem.type === 'lesson' ? 'lesson_detail' : 'dashboard')} className="bg-white/10 hover:bg-red-500/80 px-8 py-4 rounded-2xl text-lg font-black transition-all border border-white/10 w-full md:w-auto">إلغاء الخروج</button>

                                    <div className="bg-white p-10 md:p-12 rounded-[2.5rem] border-r-[12px] border-indigo-600 text-2xl font-black leading-loose shadow-xl text-indigo-950">
                                        {currentItem.passage}
                                    </div>
                                )}

                                    const l = lockedAnswers[q.id];
                                    return (
                                        <div key={q.id} className={`p-8 md:p-10 rounded-[2.5rem] border-4 transition-all bg-white shadow-lg ${l ? 'border-emerald-400 shadow-emerald-100' : 'border-slate-100 hover:border-indigo-300 hover:shadow-2xl'}`}>
                                            <div className="flex flex-col md:flex-row justify-between items-start gap-4 mb-10">
                                                <p className="font-black text-2xl text-slate-800 leading-loose flex-1">
                                                    <span className="bg-indigo-600 text-white px-5 py-2 rounded-xl ml-4 text-xl shadow-md inline-block">س {idx+1}</span>
                                                    {q.text}
                                                </p>
                                                {l && <span className="text-emerald-700 font-black flex items-center justify-center gap-2 text-lg bg-emerald-100 px-6 py-3 rounded-2xl border-2 border-emerald-200 shadow-sm w-full md:w-auto">مؤكد ✅</span>}
                                            </div>
                                            {q.type === 'mcq' ? (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                                                    {q.options.map(o => (
                                                        <button key={o} disabled={l} onClick={() => setAnswers({...answers, [q.id]: o})} className={`p-6 rounded-2xl border-4 font-black text-xl transition-all ${answers[q.id] === o ? 'border-indigo-600 bg-indigo-50 text-indigo-800 shadow-lg transform scale-[1.02]' : 'border-slate-100 hover:bg-slate-50 text-slate-600 hover:border-slate-300'} ${l && answers[q.id] !== o ? 'opacity-40 bg-slate-50' : ''}`}>{o}</button>
                                                    ))}
                                                </div>
                                            ) : (
                                                <input type="text" disabled={l} placeholder="اكتب إجابتك هنا بدقة..." value={answers[q.id] || ''} onChange={e => setAnswers({...answers, [q.id]: e.target.value})} className={`w-full p-8 mb-8 rounded-2xl border-4 outline-none text-2xl transition-all ${l ? 'border-emerald-400 bg-emerald-50/50 font-black text-emerald-900 shadow-inner' : 'border-slate-200 focus:border-indigo-600 focus:ring-8 focus:ring-indigo-50 font-bold'}`}/>
                                            )}
                                            {!l && <button onClick={() => handleLockAnswer(q.id)} className="w-full py-6 bg-slate-800 text-white rounded-2xl text-2xl font-black shadow-2xl hover:bg-indigo-700 transition-transform active:scale-95 flex items-center justify-center gap-3">🔒 قفل الإجابة نهائياً (لا يمكن التعديل)</button>}
                                        </div>
                                    );
                                })}
                                
                                <div className="pt-12 border-t-4 border-slate-200 border-dashed">
                                    <button disabled={!allDone} onClick={handleSubmit} className={`w-full py-8 rounded-[2.5rem] font-black text-4xl shadow-2xl transition-all ${allDone ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-indigo-300 hover:-translate-y-2 ring-8 ring-indigo-600/30' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>إرسال ورؤية النتيجة فوراً 🚀</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'result' && studentEvaluation) return (
                <div className="min-h-screen bg-slate-100 p-4 md:p-10 flex items-center justify-center">
                    <div className="bg-white p-10 md:p-16 rounded-[3rem] shadow-2xl w-full max-w-4xl text-center border-t-[20px] border-emerald-500 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-50 via-white to-white opacity-50 pointer-events-none"></div>
                        <div className="text-8xl mb-8 relative z-10 drop-shadow-2xl">🏆</div>
                        <h2 className="text-9xl font-black text-emerald-600 mb-6 relative z-10 tracking-tighter drop-shadow-sm">{studentEvaluation.score} <span className="text-5xl text-slate-300 tracking-normal">/ 10</span></h2>
                        <p className="text-slate-700 font-black mb-10 text-3xl relative z-10 bg-emerald-50 inline-block px-8 py-3 rounded-full border-2 border-emerald-100 shadow-sm">{studentEvaluation.generalComment}</p>
                        
                        <div className="mb-10 relative z-10">
                            <button onClick={sendWhatsApp} className="w-full py-6 bg-emerald-500 hover:bg-emerald-600 text-white rounded-3xl font-black text-2xl shadow-xl hover:-translate-y-1 transition-all flex items-center justify-center gap-4">
                                💬 إرسال النتيجة للأستاذ طارق عبر واتساب
                            </button>
                            <p className="text-sm text-slate-500 font-bold mt-3">اضغط على الزر ليتم إرسال درجتك وبياناتك للمعلم تلقائياً.</p>
                        </div>
                        
                        <div className="text-right space-y-6 pt-10 border-t-4 border-slate-100 max-h-[50vh] overflow-y-auto pr-6 custom-scrollbar relative z-10">
                            <h3 className="font-black text-indigo-900 mb-8 text-3xl flex items-center gap-3">🔍 المراجعة التفصيلية للأخطاء:</h3>
                            {studentEvaluation.feedback.map((f, i) => (
                                <div key={i} className={`p-8 rounded-[2rem] border-4 shadow-sm ${f.isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50/80 border-red-300'}`}>
                                    <p className="font-black text-slate-800 mb-6 text-xl leading-relaxed">{f.isCorrect ? "✅" : "❌"} {f.text}</p>
                                    <div className="bg-white p-5 rounded-2xl border-2 border-slate-100 mb-4 shadow-inner">
                                        <p className="text-base text-slate-500 font-bold">إجابتك: <span className="text-slate-900 font-black text-xl ml-3">{f.studentAnswer}</span></p>
                                    </div>
                                    {!f.isCorrect && (
                                        <div className="bg-emerald-100 p-5 rounded-2xl border-2 border-emerald-200 shadow-sm mt-3">
                                            <p className="text-base text-emerald-900 font-black flex items-center gap-3">💡 الإجابة النموذجية: <span className="text-xl bg-white px-4 py-2 rounded-xl border border-emerald-200">{f.correctAnswer}</span></p>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                        <button onClick={() => setView('dashboard')} className="w-full py-6 bg-slate-900 hover:bg-indigo-700 text-white rounded-3xl font-black text-3xl mt-12 shadow-2xl hover:-translate-y-2 transition-all relative z-10">العودة للوحة القيادة</button>
                    </div>
                </div>
            );

                // فلترة الطلاب فقط (إزالة حساب المعلم إن وُجد في قائمة التسجيل)
                const studentOnlyUsers = usersDb.filter(u => u.role === 'student');

                return (
                    <div className="min-h-screen bg-slate-100 p-4 md:p-10">
                        <div className="max-w-7xl mx-auto bg-white rounded-[3rem] shadow-2xl overflow-hidden border-2 border-slate-200">
                            <div className="hero-gradient p-10 md:p-12 text-white flex flex-col md:flex-row justify-between items-center gap-6 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-96 h-96 bg-indigo-500 rounded-full blur-3xl opacity-30 -translate-y-1/2 translate-x-1/4"></div>
                                <div className="relative z-10 text-center md:text-right">
                                    <h2 className="text-5xl font-black mb-4 text-white drop-shadow-md">📋 سجل المعلم طارق</h2>
                                    <p className="text-indigo-100 text-lg font-bold bg-white/10 inline-block px-6 py-2 rounded-xl backdrop-blur-sm border border-white/20">النظام الذكي لتتبع الإنجازات والتواصل مع الطلاب</p>
                                </div>
                                <button onClick={() => setView('auth')} className="bg-rose-500 text-white px-10 py-4 rounded-2xl font-black hover:bg-rose-600 transition-all text-xl shadow-xl relative z-10 w-full md:w-auto border border-rose-400">إغلاق السجل 🔒</button>

                                <table className="w-full text-right border-collapse">
                                    <thead>
                                        <tr className="bg-slate-100 text-slate-600 text-lg border-b-4 border-slate-200">
                                            <th className="p-6 font-black rounded-tr-3xl">اسم الطالب (المسجل)</th>
                                            <th className="p-6 font-black text-center">أرقام التواصل</th>
                                            <th className="p-6 font-black text-center">الإنجاز الكلي</th>
                                            <th className="p-6 font-black text-center">متوسط درجاته</th>
                                            <th className="p-6 font-black text-center rounded-tl-3xl">الإجراءات</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {studentOnlyUsers.map((student, i) => {
                                            const stdStats = getStudentStats(student.id);
                                            return (
                                                <tr key={i} className="border-b-2 border-slate-50 hover:bg-indigo-50/50 transition-colors">
                                                    <td className="p-6 font-black text-3xl text-indigo-950">{student.name} <br/><span className="text-lg font-bold text-slate-400 mt-2 inline-block bg-slate-100 px-3 py-1 rounded-lg">فصل: {student.class}</span></td>
                                                    <td className="p-6 text-center">
                                                        <div className="flex flex-col gap-2 text-base font-bold text-slate-500">
                                                            <span>طالب: <a href={`tel:${student.phone}`} className="text-indigo-600 hover:underline" dir="ltr">{student.phone}</a></span>
                                                            <span>ولي أمر: <a href={`tel:${student.parentPhone}`} className="text-emerald-600 hover:underline" dir="ltr">{student.parentPhone}</a></span>
                                                        </div>
                                                    </td>
                                                    <td className="p-6 text-center">
                                                        <div className="flex flex-col gap-3 items-center justify-center">
                                                            <span className="bg-blue-100 text-blue-800 px-5 py-2 rounded-xl font-black text-sm w-full max-w-[150px] shadow-sm">دروس: {stdStats.lessonsCount}</span>
                                                            <span className="bg-purple-100 text-purple-800 px-5 py-2 rounded-xl font-black text-sm w-full max-w-[150px] shadow-sm">اختبارات: {stdStats.examsCount}</span>
                                                        </div>
                                                    </td>
                                                    <td className="p-6 text-center"><span className={`px-6 py-3 rounded-2xl font-black text-xl shadow-sm border ${stdStats.avgScore >= 7 ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : stdStats.avgScore >= 5 ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-red-100 text-red-800 border-red-200'}`}>{stdStats.avgScore} / 10</span></td>
                                                    <td className="p-6 text-center"><button onClick={() => setSelectedStudentId(student.id)} className="bg-slate-900 text-white px-8 py-4 rounded-2xl text-lg font-black hover:bg-indigo-600 transition-all shadow-xl hover:-translate-y-1">فتح الملف 👁️</button></td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                                {studentOnlyUsers.length === 0 && (
                                    <div className="text-center py-40">
                                        <div className="text-9xl mb-8 opacity-20">📭</div>
                                        <h3 className="text-4xl font-black text-slate-300">لم يسجل أي طالب في المنصة حتى الآن.</h3>
                                    </div>
                                )}
                            </div>
                            
                            {selectedStudentId && (
                                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex justify-center items-center p-4 z-50">
                                    <div className="bg-white w-full max-w-5xl max-h-[90vh] rounded-[3rem] overflow-y-auto p-12 shadow-2xl border-8 border-indigo-200 relative custom-scrollbar">
                                        <button onClick={() => setSelectedStudentId(null)} className="absolute top-10 left-10 bg-slate-100 w-16 h-16 flex items-center justify-center rounded-full font-black text-slate-400 hover:bg-red-100 hover:text-red-600 transition-all text-3xl shadow-md border-2 border-slate-200">✕</button>
                                        
                                        {(() => {
                                            const student = usersDb.find(u => u.id === selectedStudentId);
                                            const stdStats = getStudentStats(student.id);
                                            return (
                                                <>
                                                <div className="mb-12 border-b-4 border-slate-100 pb-8">
                                                    <h3 className="text-5xl font-black text-indigo-950 mb-6">{student.name}</h3>
                                                    <div className="flex flex-wrap gap-3">
                                                        <p className="text-lg text-slate-600 font-bold bg-slate-100 px-5 py-2 rounded-xl border border-slate-200">فصل: {student.class}</p>
                                                        <a href={`tel:${student.phone}`} className="text-lg text-blue-700 font-bold bg-blue-50 px-5 py-2 rounded-xl border border-blue-200 hover:bg-blue-100">هاتف الطالب: {student.phone}</a>
                                                        <a href={`tel:${student.parentPhone}`} className="text-lg text-emerald-700 font-bold bg-emerald-50 px-5 py-2 rounded-xl border border-emerald-200 hover:bg-emerald-100">هاتف ولي الأمر: {student.parentPhone}</a>
                                                    </div>
                                                </div>

                                                <div className="space-y-10">
                                                    {stdStats.results.length === 0 ? (
                                                        <p className="text-2xl font-bold text-slate-400 text-center py-10">هذا الطالب سجل حسابه ولم يحل أي تدريب بعد.</p>
                                                    ) : (
                                                        stdStats.results.map((t, idx) => (
                                                            <div key={idx} className="bg-slate-50 p-10 rounded-[2.5rem] border-2 border-slate-200 shadow-sm">
                                                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b-2 border-slate-200 pb-8 gap-6">
                                                                    <div>
                                                                        <span className={`text-sm font-black px-4 py-2 rounded-xl uppercase tracking-wider block mb-3 w-max shadow-sm ${t.type === 'lesson' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}`}>{t.type === 'lesson' ? 'تدريب درس' : 'امتحان شامل'}</span>
                                                                        <h4 className="font-black text-3xl text-indigo-900">{t.testTitle}</h4>
                                                                        <p className="text-sm text-slate-400 font-bold mt-2">{new Date(t.timestamp).toLocaleString('ar-EG')}</p>
                                                                    </div>
                                                                    <span className={`px-8 py-4 rounded-2xl font-black text-2xl shadow-md border ${t.score >= 7 ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-red-100 text-red-800 border-red-200'}`}>الدرجة: {t.score} / 10</span>
                                                                </div>
                                                                <div className="space-y-6">
                                                                    {t.feedback.map((f, i) => (
                                                                        <div key={i} className={`p-8 rounded-3xl border-4 ${f.isCorrect ? 'bg-emerald-50/50 border-emerald-100' : 'bg-red-50/50 border-red-200'}`}>
                                                                            <p className="font-black text-xl mb-6 text-slate-800 leading-relaxed">{f.isCorrect ? '✅' : '❌'} {f.text}</p>
                                                                            <div className="flex flex-col md:flex-row justify-between text-base gap-4 bg-white p-5 rounded-2xl border-2 border-slate-100 shadow-inner">
                                                                                <span className="text-slate-500 font-bold">إجابته: <span className="text-slate-900 font-black text-lg ml-3">{f.studentAnswer}</span></span>
                                                                                {!f.isCorrect && <span className="text-red-700 font-black bg-red-50 px-4 py-2 rounded-xl border border-red-100 text-center">الصح المبرمج: {f.correctAnswer}</span>}
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                                </>
                                            );
                                        })()}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
