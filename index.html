          {
            id: 18, title: "القطعة الثامنة عشرة",
            passage: "«بالسعى والعمل تحقق الخيرات، فاسعَ تحقق أحلامك، واجعل مصباحك الاجتهاد، فالكسول غير مرغوب فيه، فلا تكن منشارًا للكسل فى مجتمع يحلم بمستقبل أفضل».",
            questions: [
              { id: '18_0', type: 'text', text: "(ب) إعراب كلمة «أفضل»:", correctAnswers: ["نعت مجرور بالفتحة", "نعت مجرور", "نعت"] },
              { id: '18_1', type: 'text', text: "(ب) إعراب كلمة «فاسعَ»:", correctAnswers: ["فعل أمر مبني على حذف حرف العلة", "فعل امر"] },
              { id: '18_2', type: 'text', text: "استخرج اسم آلة واسم فاعل:", correctAnswers: ["مصباح", "ساع"] },
              { id: '18_3', type: 'text', text: "صوب: الأرض في الربيع أخضر من الخريف:", correctAnswers: ["اشد خضرة", "اكثر خضرة"] }
            ]
          },
          {
            id: 19, title: "محافظة القاهرة (الأضواء)",
            passage: "«أسهم في زراعة شجرة يستظل بظلها الناس، ويأكلون من ثمرها، وتتجمل البيئة بها، وتسهم في تلطيف حرارة الجو؛ فالإكثار من زراعة الأماكن الخضراء له ثماره العظيمة؛ لذا نحن مدعوون لهذا العمل المفيد».",
            questions: [
              { id: '19_0', type: 'text', text: "(أ) إعراب كلمة «الناس»:", correctAnswers: ["فاعل مرفوع", "فاعل"] },
              { id: '19_1', type: 'text', text: "(أ) إعراب كلمة «حرارة»:", correctAnswers: ["مضاف إليه مجرور", "مضاف اليه"] },
              { id: '19_2', type: 'text', text: "استخرج اسم فاعل واسم مفعول:", correctAnswers: ["المفيد", "مدعوون"] },
              { id: '19_3', type: 'mcq', text: "(الرجل مذياع للخير) نوع مذياع:", options: ["آلة", "فاعل", "مبالغة"], correctAnswer: "صيغة مبالغة" }
            ]
          },
          {
            id: 20, title: "محافظة الإسكندرية (الأضواء)",
            passage: "«إن الحب بين الناس مقياس للرقى، والشعب الذى يعيش بغير حب شعب متخلف الإحساس والمجتمع المشهود له بالحب هو أصل الحياة الرائعة، وهو أسعد من أمة تمزقها العداوة والبغضاء».",
            questions: [
              { id: '20_0', type: 'text', text: "(أ) إعراب كلمة «مقياس»:", correctAnswers: ["خبر إن مرفوع", "خبر ان"] },
              { id: '20_1', type: 'text', text: "(أ) إعراب كلمة «شعب»:", correctAnswers: ["خبر المبتدأ مرفوع", "خبر"] },
              { id: '20_2', type: 'text', text: "استخرج اسم آلة واسم فاعل غير ثلاثي:", correctAnswers: ["مقياس", "متخلف"] }
            ]
          }
        ];

        const App = () => {
            const [studentInfo, setStudentInfo] = useState({ name: '', class: '' });
            const [view, setView] = useState('login'); 
            const [selectedTestId, setSelectedTestId] = useState(null);
            const [answers, setAnswers] = useState({});
            const [lockedAnswers, setLockedAnswers] = useState({});
            const [allResults, setAllResults] = useState([]);
            const [completedTests, setCompletedTests] = useState([]); 
            const [passwordInput, setPasswordInput] = useState('');
            const [studentEvaluation, setStudentEvaluation] = useState(null); 
            const [selectedStudentName, setSelectedStudentName] = useState(null); // لعرض ملف طالب محدد في لوحة المعلم

            const currentTest = selectedTestId ? grammarTests.find(t => t.id === selectedTestId) : null;

            // استرجاع النتائج القديمة بحيث لا يضيع مجهود الطلاب
            useEffect(() => {
                const savedResults = localStorage.getItem('grammar_results');
                if (savedResults) setAllResults(JSON.parse(savedResults));
                const savedCompleted = localStorage.getItem('completed_tests');
                if (savedCompleted) setCompletedTests(JSON.parse(savedCompleted));
            }, []);

            const normalizeArabic = (t) => !t ? "" : t.replace(/[\u064B-\u065F\u0670]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ـ/g, "").trim();

            const handleLockAnswer = (qId) => {
                if (!answers[qId] || answers[qId].trim() === '') {
                    alert("برجاء إدخال إجابة قبل التأكيد."); return;
                }
                setLockedAnswers(prev => ({ ...prev, [qId]: true }));
            };

            const handleSubmit = () => {
                let correctCount = 0;
                const feedback = currentTest.questions.map(q => {
                    const ans = (answers[q.id] || "").trim();
                    let isCorrect = false;
                    let correctDisplay = "";
                    if (q.type === 'mcq') {
                        isCorrect = (ans === q.correctAnswer);
                        correctDisplay = q.correctAnswer;
                    } else {
                        // مطابقة ذكية مرنة للإعراب والأسئلة المقالية
                        isCorrect = q.correctAnswers.some(k => normalizeArabic(ans).includes(normalizeArabic(k)));
                        correctDisplay = q.correctAnswers[0]; // إظهار الإجابة النموذجية الأولى
                    }
                    if (isCorrect) correctCount++;
                    return { text: q.text, studentAnswer: ans || "لم يجب", isCorrect, correctAnswer: correctDisplay };
                });

                const score = Math.round((correctCount / currentTest.questions.length) * 10);
                const evalResult = { score, feedback, generalComment: score >= 7 ? "ممتاز يا بطل!" : "راجع أخطاءك جيداً لتتعلم." };

                const resultData = { id: Date.now().toString(), studentName: studentInfo.name, studentClass: studentInfo.class, testTitle: currentTest.title, score, feedback, timestamp: new Date().toISOString() };
                const newResults = [...allResults, resultData];
                setAllResults(newResults);
                localStorage.setItem('grammar_results', JSON.stringify(newResults)); // قراءة وحفظ النتائج

                const newCompleted = [...new Set([...completedTests, selectedTestId])];
                setCompletedTests(newCompleted);
                localStorage.setItem('completed_tests', JSON.stringify(newCompleted));

                setStudentEvaluation(evalResult);
                setView('result');
            };

            // ==========================================
            // تجميع النتائج للمعلم (عرض بأسماء الطلاب)
            // ==========================================
            const groupedStudents = {};
            allResults.forEach(res => {
                if (!groupedStudents[res.studentName]) {
                    groupedStudents[res.studentName] = { class: res.studentClass, tests: [] };
                }
                groupedStudents[res.studentName].tests.push(res);
            });
            const studentNamesList = Object.keys(groupedStudents);

            if (view === 'login') return (
                <div className="min-h-screen bg-indigo-50 flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-t-8 border-indigo-600 text-center">
                        <div className="text-5xl mb-4">📘</div>
                        <h1 className="text-3xl font-black text-slate-800 mb-2">منصة الأستاذ طارق</h1>
                        <p className="text-slate-500 mb-6 font-medium text-sm">اختبارات النحو الإلكترونية الشاملة</p>
                        <input type="text" placeholder="اسم الطالب الثلاثي" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full p-4 mb-4 rounded-xl border-2 border-slate-100 outline-none focus:border-indigo-500 text-center font-bold"/>
                        <input type="text" placeholder="الفصل الدراسي" value={studentInfo.class} onChange={e => setStudentInfo({...studentInfo, class: e.target.value})} className="w-full p-4 mb-4 rounded-xl border-2 border-slate-100 outline-none focus:border-indigo-500 text-center font-bold"/>
                        <button disabled={!studentInfo.name || !studentInfo.class} onClick={() => setView('select')} className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg hover:bg-indigo-700 disabled:bg-slate-200 shadow-md">دخول للاختبارات ◀️</button>
                        <div className="mt-8 pt-4 border-t border-slate-50">
                            <input type="password" placeholder="باسوورد المعلم" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full p-2 mb-2 rounded-lg border text-center text-sm outline-none"/>
                            <button onClick={() => passwordInput === 'tarek tarek' ? setView('teacher') : alert('كلمة المرور خاطئة! غير مصرح بالدخول.')} className="text-indigo-600 font-bold text-xs underline">دخول المعلم</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'select') return (
                <div className="min-h-screen bg-slate-50 p-6">
                    <div className="max-w-5xl mx-auto flex justify-between items-center mb-8">
                        <div><h2 className="text-2xl font-black text-indigo-800">أهلاً يا {studentInfo.name}</h2><p className="text-slate-500 text-sm">اختر قطعة للبدء (القطع المكتملة يظهر بجوارها ✅)</p></div>
                        <button onClick={() => setView('login')} className="bg-white p-3 rounded-full shadow-sm text-2xl">🚪</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {grammarTests.map(t => {
                            const done = completedTests.includes(t.id);
                            return (
                                <button key={t.id} onClick={() => { setSelectedTestId(t.id); setAnswers({}); setLockedAnswers({}); setView('quiz'); }} className={`bg-white p-5 rounded-2xl shadow-sm text-right border-2 transition-all relative ${done ? 'border-emerald-400 bg-emerald-50/20 shadow-lg' : 'border-slate-100 hover:border-indigo-400'}`}>
                                    {done && <span className="absolute top-2 left-2 bg-emerald-100 text-emerald-600 px-2 py-1 rounded-lg font-bold text-[10px]">تم الحل ✅</span>}
                                    <h3 className="font-bold text-indigo-700 mb-2">{t.title}</h3>
                                    <p className="text-slate-500 text-xs line-clamp-3 leading-relaxed">{t.passage}</p>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );

            if (view === 'quiz' && currentTest) {
                const allDone = currentTest.questions.every(q => lockedAnswers[q.id]);
                return (
                    <div className="min-h-screen bg-slate-100 p-4 md:p-10">
                        <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-indigo-100">
                            <div className="bg-indigo-600 p-6 text-white flex justify-between items-center"><h1 className="text-xl font-bold">{currentTest.title}</h1><button onClick={() => setView('select')} className="bg-white/20 px-4 py-2 rounded-lg text-sm">قائمة القطع</button></div>
                            <div className="p-6 md:p-8 space-y-6">
                                <div className="bg-amber-50 p-6 rounded-2xl border-r-8 border-amber-400 text-lg font-medium leading-loose shadow-inner">{currentTest.passage}</div>
                                {currentTest.questions.map(q => {
                                    const l = lockedAnswers[q.id];
                                    return (
                                        <div key={q.id} className={`p-5 rounded-2xl border-2 transition-all ${l ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-100'}`}>
                                            <p className="font-bold mb-4 text-slate-700">{q.text}</p>
                                            {q.type === 'mcq' ? (
                                                <div className="grid grid-cols-2 gap-2 mb-3">
                                                    {q.options.map(o => (
                                                        <button key={o} disabled={l} onClick={() => setAnswers({...answers, [q.id]: o})} className={`p-4 rounded-xl border font-bold text-sm ${answers[q.id] === o ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-600'}`}>{o}</button>
                                                    ))}
                                                </div>
                                            ) : (
                                                <input type="text" disabled={l} placeholder="اكتب إجابتك هنا..." value={answers[q.id] || ''} onChange={e => setAnswers({...answers, [q.id]: e.target.value})} className="w-full p-4 mb-3 rounded-xl border-2 outline-none focus:border-indigo-400 text-sm font-bold"/>
                                            )}
                                            {!l && <button onClick={() => handleLockAnswer(q.id)} className="w-full py-2 bg-slate-800 text-white rounded-xl text-xs font-bold shadow">🔒 تأكيد وقفل الإجابة</button>}
                                        </div>
                                    );
                                })}
                                <button disabled={!allDone} onClick={handleSubmit} className={`w-full py-4 rounded-2xl font-black text-xl shadow-lg transition-all ${allDone ? 'bg-indigo-600 text-white shadow-indigo-200' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>إرسال ورؤية النتيجة</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'result' && studentEvaluation) return (
                <div className="min-h-screen bg-indigo-50 p-6 flex items-center justify-center">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-2xl text-center border-t-8 border-emerald-500">
                        <div className="text-6xl mb-4">🏆</div>
                        <h2 className="text-6xl font-black text-emerald-600 mb-2">{studentEvaluation.score} <span className="text-2xl text-slate-400">/ 10</span></h2>
                        <p className="text-slate-600 font-bold mb-8 italic">{studentEvaluation.generalComment}</p>
                        <div className="text-right space-y-3 pt-6 border-t h-[400px] overflow-y-auto pr-2">
                            <h3 className="font-black text-indigo-700 mb-4 border-b pb-2">مراجعة الأسئلة وتصحيح الأخطاء:</h3>
                            {studentEvaluation.feedback.map((f, i) => (
                                <div key={i} className={`p-4 rounded-xl border-2 ${f.isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                                    <p className="font-bold text-slate-800 mb-1">{f.isCorrect ? "✅" : "❌"} {f.text}</p>
                                    <p className="text-xs text-slate-500 font-bold">إجابتك: {f.studentAnswer}</p>
                                    {!f.isCorrect && <p className="text-xs text-emerald-700 font-black mt-1">الإجابة الصحيحة: {f.correctAnswer}</p>}
                                </div>
                            ))}
                        </div>
                        <button onClick={() => setView('select')} className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold mt-8 shadow-lg">العودة للرئيسية</button>
                    </div>
                </div>
            );

            if (view === 'teacher') return (
                <div className="min-h-screen bg-slate-50 p-6">
                    <div className="max-w-6xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-indigo-200">
                        <div className="bg-indigo-900 p-8 text-white flex justify-between items-center">
                            <div><h2 className="text-2xl font-black mb-1">📋 سجل دراسات ودرجات الطلاب (الأستاذ طارق)</h2><p className="text-indigo-300 text-xs font-bold">كل طالب له ملف شخصي يحتوي على إنجازاته</p></div>
                            <button onClick={() => setView('login')} className="bg-white/10 px-6 py-2 rounded-xl font-bold hover:bg-red-500 transition-all">خروج</button>
                        </div>
                        <div className="overflow-x-auto p-4">
                            <table className="w-full text-right border-collapse">
                                <thead><tr className="bg-slate-100 text-slate-500 text-sm border-b"><th className="p-4">اسم الطالب</th><th className="p-4">الفصل</th><th className="p-4 text-center">القطع التي حلها</th><th className="p-4 text-center">متوسط الدرجات</th><th className="p-4 text-center">ملف الطالب</th></tr></thead>
                                <tbody>
                                    {studentNamesList.map((name, i) => {
                                        const stdData = groupedStudents[name];
                                        const avgScore = (stdData.tests.reduce((acc, curr) => acc + curr.score, 0) / stdData.tests.length).toFixed(1);
                                        return (
                                            <tr key={i} className="border-b hover:bg-indigo-50/50 transition-colors">
                                                <td className="p-4 font-bold text-lg text-indigo-900">{name}</td>
                                                <td className="p-4 text-sm font-medium">{stdData.class}</td>
                                                <td className="p-4 text-center"><span className="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full font-bold">{stdData.tests.length} قطع</span></td>
                                                <td className="p-4 text-center"><span className={`px-4 py-1 rounded-full font-bold text-sm ${avgScore >= 5 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{avgScore}/10</span></td>
                                                <td className="p-4 text-center"><button onClick={() => setSelectedStudentName(name)} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-600 transition-colors">عرض التفاصيل 👁️</button></td>
                                            </tr>
                                        )
                                    })}
                                </tbody>
                            </table>
                            {studentNamesList.length === 0 && <div className="text-center py-20 text-slate-400 font-bold">لا توجد نتائج مسجلة حتى الآن.</div>}
                        </div>
                        
                        {/* نافذة ملف الطالب التفصيلية */}
                        {selectedStudentName && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
                                <div className="bg-white w-full max-w-3xl max-h-[85vh] rounded-3xl overflow-y-auto p-6 shadow-2xl border-4 border-indigo-100">
                                    <div className="flex justify-between items-center mb-6 sticky top-0 bg-white pb-4 border-b">
                                        <div><h3 className="text-2xl font-black text-indigo-900">ملف الطالب: {selectedStudentName}</h3><p className="text-sm text-slate-500 font-bold">فصل: {groupedStudents[selectedStudentName].class}</p></div>
                                        <button onClick={() => setSelectedStudentName(null)} className="bg-slate-100 w-10 h-10 rounded-full font-bold text-slate-400 hover:text-red-500 transition-all">✕</button>
                                    </div>
                                    <div className="space-y-6">
                                        {groupedStudents[selectedStudentName].tests.map((t, idx) => (
                                            <div key={idx} className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                                    <h4 className="font-bold text-indigo-800">{t.testTitle}</h4>
                                                    <span className={`px-3 py-1 rounded-full font-bold text-xs ${t.score >= 5 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>الدرجة: {t.score}/10</span>
                                                </div>
                                                <div className="space-y-3">
                                                    {t.feedback.map((f, i) => (
                                                        <div key={i} className={`p-3 rounded-xl border ${f.isCorrect ? 'bg-emerald-50/50 border-emerald-100' : 'bg-red-50/50 border-red-100'}`}>
                                                            <p className="font-bold text-xs mb-1 text-slate-700">{f.isCorrect ? '✅' : '❌'} {f.text}</p>
                                                            <div className="flex justify-between text-[11px]">
                                                                <span className="text-slate-500 font-bold">إجابته: <span className="text-slate-900">{f.studentAnswer}</span></span>
                                                                {!f.isCorrect && <span className="text-red-600 font-black">الصح: {f.correctAnswer}</span>}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
