              { id: 'q2', type: 'text', text: "(ب) استخرج: اسم مفعول (غير ثلاثى) - اسم فاعل (ثلاثى) - اسم تفضيل - اسم آلة." },
              { id: 'q3', type: 'mcq', text: "(جـ) من المسلم به أننا محتاجون إلى عقول مبتكرة ومبدعة. اسم المفعول:", options: ["المسلم", "محتاجون", "مبتكرة", "مبدعة"] },
              { id: 'q4', type: 'text', text: "(د) صوب الخطأ: هذه الزهرة أحمر من غيرها." }
            ]
          },
          {
            id: 14, title: "القطعة الرابعة عشرة",
            passage: "«بنى مصر سيروا على بركة الله، واعملوا مخلصين على أن تتسلحوا بالعلم؛ فالعلم هو مفتاح النهضة والتقدم، ولا تظنوا الطريق ممهدة، ولكن يجب عليكم الكفاح لتحقيق مهام عظيمة لوطنكم منبع الحضارات».",
            questions: [
              { id: 'q1', type: 'mcq', text: "(أ) بنى إعرابها:", options: ["مبتدأ", "منادى منصوب", "خبر", "منادى مبني"] },
              { id: 'q2', type: 'text', text: "(ب) استخرج: اسم فاعل واذكر فعله - اسم مكان وزنه." },
              { id: 'q3', type: 'text', text: "(جـ) تلا الطالب القرآن بالأحكام. صغ من الفعل اسم مفعول وأعد كتابة الجملة." },
              { id: 'q4', type: 'text', text: "(د) كيف تكشف فى المعجم عن كلمة «مهام»؟" }
            ]
          },
          {
            id: 15, title: "القطعة الخامسة عشرة",
            passage: "«أنعم الله على مصر بموقع متميز جعلها ملتقى الحضارات، ومنح شعبها أجمل الصفات، ووهبها نيلًا عظيمًا، على ضفافه عاش شعبها حياة مسالمة يميزها الأمن والاستقرار».",
            questions: [
              { id: 'q1', type: 'text', text: "(أ) إعراب كلمة «أجمل» فى الفقرة السابقة:" },
              { id: 'q2', type: 'text', text: "(ب) استخرج: اسم مكان واذكر فعله - صيغة مبالغة واذكر وزنها." },
              { id: 'q3', type: 'mcq', text: "(جـ) الطلاب ملتقى بهم. كلمة ملتقى اسم مشتق نوعه:", options: ["اسم مكان", "اسم زمان", "اسم مفعول"] },
              { id: 'q4', type: 'text', text: "(د) الدعاء فاتح للخير. (حول لاسم آلة) / الجندى مقدام. (حول لاسم فاعل)." },
              { id: 'q5', type: 'text', text: "(هـ) صوب الخطأ: المؤمن داعى إلى الخير / هذا الحقل أخضر من غيره." }
            ]
          },
          {
            id: 16, title: "القطعة السادسة عشرة",
            passage: "«أى بنى إذا أردت الوصول إلى قمة المجد فيجب أن تكون راقيًا فى فكرك، ألوفًا فى معاملتك، مهذبًا فى سلوكك، وليكن الكتاب مفتاحًا لخزائن العلم، ولتجعل القلم سلاحًا لمواجهة التحديات».",
            questions: [
              { id: 'q1', type: 'mcq', text: "(أ) إعراب كلمة بنى منادى:", options: ["مبنى", "منصوب", "مرفوع", "مجرور"] },
              { id: 'q2', type: 'text', text: "(ب) استخرج: اسم مفعول وهات فعله - اسم آلة قياسيًّا." },
              { id: 'q3', type: 'text', text: "(جـ) الأمة (معلمة) أبناءها ليكون (مهيبًا) جانبها. نوع المشتقين:" },
              { id: 'q4', type: 'text', text: "(د) المؤمن مهتدى / الليل مهتدى. بين نوع المشتق فيما سبق." },
              { id: 'q5', type: 'text', text: "(هـ) المعلم يعطى المتفوقين جوائز (استبدل الفعل بصيغة مبالغة)." }
            ]
          },
          {
            id: 17, title: "القطعة السابعة عشرة",
            passage: "«الأمن والأمان خير نعم الحياة، فكن واعيًا لأهميتهما، مقدرًا خطر فقدانهما، ولن يتحقق الأمن إلا بإخلاصك لوطنك، وينبغى لكل محب لهذا الوطن العمل لرفعته، وأن يكون بنَّاء لأركانه لا معول هدم له».",
            questions: [
              { id: 'q1', type: 'mcq', text: "(أ) مقدرًا الواردة فى الفقرة اسم فاعل لفعل:", options: ["ثلاثى صحيح", "رباعى", "خماسى", "ثلاثى معتل"] },
              { id: 'q2', type: 'text', text: "(ب) استخرج: صيغة مبالغة وزنها - اسم آلة واذكر وزنه." },
              { id: 'q3', type: 'mcq', text: "(جـ) الأرض محاط سطحها بالهواء. المشتق اسم زمان.", options: ["صح", "خطأ"] },
              { id: 'q4', type: 'text', text: "(د) المعلم (....) بالاحترام (تفضيل) / المساء ملتقى الأصدقاء (اجعله اسم مفعول)." },
              { id: 'q5', type: 'text', text: "(هـ) أعرب ما فوق الخط." }
            ]
          },
          {
            id: 18, title: "القطعة الثامنة عشرة",
            passage: "«بالسعى والعمل الخيرات، فاسعَ تحقق أحلامك، واجعل مصباحك الاجتهاد، فالكسول غير مرغوب فيه، فلا تكن منشارًا للكسل فى مجتمع يحلم بمستقبل أفضل».",
            questions: [
              { id: 'q1', type: 'mcq', text: "(أ) اسم المفعول مرغوب مشتق من الفعل رُغِبَ.", options: ["صح", "خطأ"] },
              { id: 'q2', type: 'text', text: "(ب) اختر الإعراب الصحيح: أفضل / فاسعَ" },
              { id: 'q3', type: 'text', text: "(جـ) استخرج: اسم آلة وحدد وزنه - اسم فاعل واكتب فعله." },
              { id: 'q4', type: 'text', text: "(د) ضع الفعل «التقى» فى جملتين بحيث يكون (اسم زمان) و(اسم مكان)." },
              { id: 'q5', type: 'text', text: "(هـ) الأرض فى فصل الربيع أخضر من الخريف. (صوب الخطأ)." },
              { id: 'q6', type: 'text', text: "(و) ما صاد الصياد السمك اليوم. (استبدل بالفعل اسم مفعول)." }
            ]
          },
          {
            id: 19, title: "امتحان محافظة القاهرة",
            passage: "«أسهم في زراعة شجرة يستظل بظلها الناس، ويأكلون من ثمرها، وتتجمل البيئة بها، وتسهم في تلطيف حرارة الجو؛ فالإكثار من زراعة الأماكن الخضراء له ثماره العظيمة؛ لذا نحن جميعًا مدعوون لهذا العمل المفيد».",
            questions: [
              { id: 'q1', type: 'text', text: "(أ) أعرب ما تحته خط." },
              { id: 'q2', type: 'text', text: "(ب) استخرج: اسم فاعل - اسم مفعول." },
              { id: 'q3', type: 'text', text: "(جـ) الطالب الذكى (يفطن). صغ صيغة مبالغة / (استعدا) صغ اسم تفضيل." },
              { id: 'q4', type: 'mcq', text: "(د) الرجل (مذياع) للخير. نوع المشتق:", options: ["اسم آلة", "اسم فاعل", "صيغة مبالغة"] }
            ]
          },
          {
            id: 20, title: "امتحان محافظة الإسكندرية",
            passage: "«إن الحب بين الناس مقياس للرقى، والشعب الذى يعيش بغير حب شعب متخلف الإحساس والمجتمع المشهود له بالحب هو أصل الحياة الرائعة، وهو أسعد من أمة تمزقها العداوة والبغضاء».",
            questions: [
              { id: 'q1', type: 'text', text: "(أ) أعرب ما تحته خط." },
              { id: 'q2', type: 'text', text: "(ب) استخرج: اسم آلة - اسم فاعل لفعل غير ثلاثي." },
              { id: 'q3', type: 'mcq', text: "(جـ) لا يتم صياغة التفضيل من (تحقق) لأنه فعل غير متصرف.", options: ["صح", "خطأ"] },
              { id: 'q4', type: 'text', text: "(هـ) انتمى المصرى للوطن (عبر بأسلوب تفضيل)." }
            ]
          }
        ];

        const App = () => {
            const [studentInfo, setStudentInfo] = useState({ name: '', class: '' });
            const [view, setView] = useState('login'); 
            const [selectedTestId, setSelectedTestId] = useState(null);
            const [answers, setAnswers] = useState({});
            const [lockedAnswers, setLockedAnswers] = useState({});
            const [loading, setLoading] = useState(false);
            const [allResults, setAllResults] = useState([]);
            const [selectedResultDetail, setSelectedResultDetail] = useState(null); 

            const currentTest = grammarTests.find(t => t.id === selectedTestId);

            useEffect(() => {
                if (view === 'teacher' && db) {
                    const unsubscribe = db.collection('student_results')
                        .orderBy('timestamp', 'desc')
                        .onSnapshot((snapshot) => {
                            const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setAllResults(docs);
                        });
                    return () => unsubscribe();
                }
            }, [view]);

            const handleAnswerChange = (qId, value) => {
                if (lockedAnswers[qId]) return;
                setAnswers(prev => ({ ...prev, [qId]: value }));
            };

            const handleLockAnswer = (qId) => {
                if (!answers[qId] || answers[qId].trim() === '') {
                    alert("رجاءً أدخل إجابة قبل التأكيد.");
                    return;
                }
                setLockedAnswers(prev => ({ ...prev, [qId]: true }));
            };

            const handleSubmit = async () => {
                if (GEMINI_API_KEY === "ضع_مفتاح_جيمناي_هنا") {
                    alert("⚠️ المعلم لم يقم بإضافة مفتاح الذكاء الاصطناعي (API Key) في الكود، لا يمكن إتمام التصحيح.");
                    return;
                }
                if (!db) {
                    alert("⚠️ المعلم لم يقم بإضافة قاعدة بيانات Firebase، لا يمكن حفظ نتيجتك.");
                    return;
                }

                setLoading(true);

                const formattedQA = currentTest.questions.map(q => 
                    `السؤال: ${q.text} | إجابة الطالب: ${answers[q.id] || 'لم يجب'}`
                ).join('\n');

                const systemPrompt = `أنت معلم لغة عربية خبير. صحح هذه القطعة: "${currentTest.passage}"
                الإجابات: ${formattedQA}
                أرجع JSON فقط: { "score": number, "feedback": [ { "text": "السؤال", "studentAnswer": "...", "isCorrect": boolean, "correctAnswer": "...", "comment": "..." } ], "generalComment": "..." }`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "صحح هذه الإجابات" }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const data = await response.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    
                    await db.collection('student_results').add({
                        studentName: studentInfo.name,
                        studentClass: studentInfo.class,
                        testTitle: currentTest.title,
                        score: result.score,
                        feedback: result.feedback, 
                        generalComment: result.generalComment,
                        timestamp: new Date().toISOString()
                    });

                    setView('success');
                } catch (error) {
                    console.error("Evaluation error:", error);
                    alert("حدث خطأ أثناء التصحيح، تأكد من صحة المفاتيح والاتصال بالإنترنت.");
                } finally {
                    setLoading(false);
                }
            };

            const exportToCSV = () => {
                if (allResults.length === 0) return;
                const headers = ["اسم الطالب", "الفصل", "القطعة", "الدرجة", "التاريخ والوقت"];
                const rows = allResults.map(res => [
                    res.studentName, res.studentClass, res.testTitle, `${res.score}/10`, new Date(res.timestamp).toLocaleString('ar-EG')
                ]);
                let csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `نتائج_الطلاب_${new Date().toLocaleDateString('ar-EG')}.csv`;
                link.click();
            };

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
                            <span className="text-6xl inline-block mb-4">📖</span>
                            <h1 className="text-3xl font-black text-slate-800 mb-2">منصة النحو الذكية</h1>
                            <p className="text-slate-500 font-medium mb-6">سجل بياناتك للبدء في حل القطع النحوية</p>
                            
                            <div className="space-y-4">
                                <input type="text" placeholder="الاسم الثلاثي" value={studentInfo.name} onChange={(e) => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full p-4 rounded-xl border-2 border-slate-200 outline-none text-lg"/>
                                <input type="text" placeholder="الفصل" value={studentInfo.class} onChange={(e) => setStudentInfo({...studentInfo, class: e.target.value})} className="w-full p-4 rounded-xl border-2 border-slate-200 outline-none text-lg"/>
                                <button disabled={!studentInfo.name || !studentInfo.class} onClick={() => setView('select')} className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg disabled:bg-slate-300">التالي ◀️</button>
                                
                                <button onClick={() => setView('teacher')} className="w-full pt-4 mt-4 border-t border-slate-100 text-indigo-600 font-bold text-sm">📋 دخول المعلم (عرض النتائج)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'select') {
                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-800">مرحباً، {studentInfo.name}</h2>
                                    <p className="text-slate-500">اختر القطعة النحوية للبدء بالاختبار (يجب تأكيد كل سؤال)</p>
                                </div>
                                <button onClick={() => setView('login')} className="text-2xl">🚪</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {grammarTests.map(test => (
                                    <button key={test.id} onClick={() => { setSelectedTestId(test.id); setAnswers({}); setLockedAnswers({}); setView('quiz'); }} className="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl text-right border border-slate-200">
                                        <span className="text-3xl mb-2 inline-block">📘</span>
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">{test.title}</h3>
                                        <p className="text-slate-500 text-sm line-clamp-2">{test.passage}</p>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'quiz') {
                const allQuestionsLocked = currentTest.questions.every(q => lockedAnswers[q.id]);
                const lockedCount = Object.keys(lockedAnswers).length;
                const totalCount = currentTest.questions.length;

                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                        <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-200">
                            <div className="bg-indigo-600 p-6 text-white flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-black mb-1">{currentTest.title}</h1>
                                    <p className="text-indigo-100 text-sm">الطالب: {studentInfo.name} | تم التأكيد على: {lockedCount}/{totalCount}</p>
                                </div>
                            </div>
                            <div className="p-6 md:p-8 space-y-8">
                                <div className="bg-amber-50 p-6 rounded-2xl border-2 border-amber-200">
                                    <p className="text-xl leading-loose text-slate-800 font-medium">{currentTest.passage}</p>
                                </div>
                                <div className="space-y-6">
                                    {currentTest.questions.map((q) => {
                                        const isLocked = lockedAnswers[q.id];
                                        return (
                                            <section key={q.id} id={`q-container-${q.id}`} className={`p-6 rounded-2xl border-2 ${isLocked ? 'border-emerald-400 bg-emerald-50' : 'border-slate-200'}`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <label className="text-lg text-slate-800 font-bold">{q.text}</label>
                                                    {isLocked && <span className="text-2xl">✅</span>}
                                                </div>
                                                {q.type === 'mcq' ? (
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                                        {q.options.map(opt => {
                                                            const isSelected = answers[q.id] === opt;
                                                            return (
                                                                <button key={opt} disabled={isLocked} onClick={() => handleAnswerChange(q.id, opt)} className={`p-4 rounded-xl border-2 font-bold text-lg ${isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-100'} ${isLocked && !isSelected ? 'opacity-50 cursor-not-allowed' : ''} ${isLocked && isSelected ? 'border-emerald-500 bg-emerald-100 text-emerald-800' : ''}`}>
                                                                    {opt}
                                                                </button>
                                                            )
                                                        })}
                                                    </div>
                                                ) : (
                                                    <input type="text" disabled={isLocked} placeholder="اكتب إجابتك هنا..." className={`w-full p-4 mb-4 rounded-xl border-2 outline-none text-lg ${isLocked ? 'border-emerald-400 bg-emerald-50 font-bold' : 'border-slate-200 focus:border-indigo-600'}`} value={answers[q.id] || ''} onChange={e => handleAnswerChange(q.id, e.target.value)} />
                                                )}
                                                {!isLocked && (
                                                    <button onClick={() => handleLockAnswer(q.id)} className="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">🔒 تأكيد وقفل الإجابة</button>
                                                )}
                                            </section>
                                        );
                                    })}
                                    <div className="pt-6 border-t border-slate-200">
                                        {!allQuestionsLocked && <p className="text-center text-red-500 font-bold mb-4">⚠️ لا يمكنك تسليم الإجابات قبل تأكيد (قفل) جميع الأسئلة أعلاه.</p>}
                                        <button onClick={handleSubmit} disabled={loading || !allQuestionsLocked} className={`w-full py-5 rounded-2xl font-black text-xl shadow-xl transition-all ${allQuestionsLocked && !loading ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                            {loading ? '⏳ جاري التصحيح والتسليم...' : '🚀 الإنهاء والتسليم النهائي للمعلم'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'success') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 text-center">
                        <div className="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-lg">
                            <span className="text-6xl inline-block mb-4">✅</span>
                            <h2 className="text-3xl font-black text-slate-800 mb-4">تم تسليم الإجابات!</h2>
                            <p className="text-lg text-slate-600 mb-8 font-medium">شكراً لك يا {studentInfo.name}. لقد تم إرسال إجاباتك وتصحيحها للمعلم.</p>
                            <button onClick={() => setView('login')} className="w-full py-4 bg-slate-800 text-white rounded-xl font-bold">العودة للصفحة الرئيسية</button>
                        </div>
                    </div>
                );
            }

            if (view === 'teacher') {
                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                        <div className="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="bg-indigo-900 p-8 text-white flex justify-between items-center">
                                <div><h2 className="text-3xl font-black">📋 نتائج الطلاب</h2></div>
                                <div className="flex gap-3">
                                    <button onClick={exportToCSV} className="bg-emerald-500 px-6 py-3 rounded-xl font-bold">📊 تحميل Excel</button>
                                    <button onClick={() => setView('login')} className="bg-white/10 px-6 py-3 rounded-xl font-bold">خروج</button>
                                </div>
                            </div>
                            <div className="p-0 overflow-x-auto">
                                {!db ? (
                                    <div className="text-center py-20 text-red-500 font-bold text-xl">⚠️ قاعدة البيانات غير متصلة! برجاء وضع إعدادات Firebase في الكود.</div>
                                ) : (
                                    <table className="w-full text-right border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                                <th className="p-5">اسم الطالب</th><th className="p-5">الفصل</th><th className="p-5">القطعة</th><th className="p-5">الدرجة</th><th className="p-5 text-center">الإجراءات</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {allResults.map((res) => (
                                                <tr key={res.id} className="border-b border-slate-100 hover:bg-indigo-50/50">
                                                    <td className="p-5 font-bold">{res.studentName}</td><td className="p-5">{res.studentClass}</td><td className="p-5">{res.testTitle}</td>
                                                    <td className="p-5"><span className="px-4 py-1 rounded-full text-sm font-bold bg-emerald-100 text-emerald-700">{res.score} / 10</span></td>
                                                    <td className="p-5 text-center">
                                                        <button onClick={() => setSelectedResultDetail(res)} className="px-3 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-sm font-bold">👁️ التفاصيل</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                            {selectedResultDetail && (
                                <div className="fixed inset-0 bg-slate-900/50 flex justify-center items-center p-4 z-50">
                                    <div className="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl flex flex-col overflow-hidden">
                                        <div className="p-6 border-b flex justify-between bg-indigo-50">
                                            <div><h3 className="text-2xl font-bold">{selectedResultDetail.studentName}</h3><p>الدرجة: {selectedResultDetail.score}/10</p></div>
                                            <button onClick={() => setSelectedResultDetail(null)} className="text-2xl">✖️</button>
                                        </div>
                                        <div className="p-6 overflow-y-auto space-y-4">
                                            {selectedResultDetail.feedback?.map((item, i) => (
                                                <div key={i} className={`p-5 rounded-2xl border ${item.isCorrect ? 'bg-emerald-50' : 'bg-red-50'}`}>
                                                    <p className="font-bold mb-2">{item.isCorrect ? '✅' : '❌'} {item.text}</p>
                                                    <p className="text-sm"><span className="font-bold">إجابة الطالب:</span> {item.studentAnswer}</p>
                                                    {!item.isCorrect && <p className="text-sm text-emerald-700"><span className="font-bold">الصحيحة:</span> {item.correctAnswer}</p>}
                                                    <p className="text-sm italic mt-2">💡 {item.comment}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
