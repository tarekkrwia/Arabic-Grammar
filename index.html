<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة اختبارات النحو الذكية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- Firebase (اختياري) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-msg').innerText = msg + " (سطر: " + line + ")";
        };
    </script>
</head>
<body class="bg-slate-50 text-slate-800">
    
    <div id="error-box" style="display: none; background-color: #fee2e2; border: 2px solid #ef4444; color: #b91c1c; padding: 20px; margin: 20px; border-radius: 10px; text-align: center;">
        <h2 style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">عذراً، حدث خطأ منع تحميل المنصة ⚠️</h2>
        <p>السبب التقني: <span id="error-msg" style="font-weight: bold;"></span></p>
    </div>

    <div id="root">
        <div id="loading-screen" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="font-size: 60px; margin-bottom: 20px; animation: bounce 1s infinite;">⏳</div>
            <h1 style="font-size: 24px; color: #4f46e5; font-weight: bold;">جاري تحميل المنصة...</h1>
        </div>
    </div>

    <script type="text/babel">
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{padding: '40px', textAlign: 'center', backgroundColor: '#fee2e2', color: '#b91c1c', margin: '20px', borderRadius: '10px'}}>
                            <h2 style={{fontSize: '24px', fontWeight: 'bold'}}>عذراً، حدث خطأ برمجي ⚠️</h2>
                            <p style={{marginTop: '10px'}}>{this.state.error.toString()}</p>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const { useState, useEffect } = React;

        // =========================================================================
        // ⚠️ إعدادات قاعدة البيانات الاختيارية ⚠️
        // =========================================================================
        const firebaseConfig = {
            apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..."
        };

        let db = null;
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "...") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        }

        // =========================================================================
        // 📚 بنك الأسئلة مع التصحيح الإلكتروني المُبرمج
        // تم وضع الإجابات الصحيحة في الكود ليطابقها النظام تلقائياً
        // =========================================================================
        const grammarTests = [
          { 
            id: 1, title: "القطعة الأولى", 
            passage: "«يعيش الطامحون تحت ظل أهدافهم، فهم صانعوا المعجزات، مستندين لإرادة قوية حتى يصير وطنهم مرضيًا أبناؤه، منبتًا لمن يرغب أن يحيا في أرض وفيرة الخيرات، فهؤلاء أجل الرجال عملًا».", 
            questions: [ 
              { id: 'q1', type: 'mcq', text: "(أ) إعراب كلمة «مستندين»:", options: ["نعت", "حال", "تمييز", "مفعول به"], correctAnswer: "حال" }, 
              { id: 'q2', type: 'text', text: "(ب) استخرج من الفقرة: اسم مكان واذكر فعله.", correctAnswers: ["منبت", "نبت"] }, 
              { id: 'q3', type: 'mcq', text: "(جـ) كلمة «أجل»:", options: ["صيغة مبالغة", "اسم آلة", "اسم تفضيل", "اسم فاعل"], correctAnswer: "اسم تفضيل" }, 
              { id: 'q4', type: 'text', text: "(د) 1- يعتمد الرجل على نظره. (ضع اسم آلة مكان «نظره»)", correctAnswers: ["منظار", "نظارة"] }, 
              { id: 'q5', type: 'text', text: "(د) 2- الله واهب المؤمن أجرًا. (اجعل اسم الفاعل صيغة مبالغة)", correctAnswers: ["وهاب"] }, 
              { id: 'q6', type: 'text', text: "(هـ) صغ من الفعل «يرغب» اسم مفعول، وغير ما يلزم:", correctAnswers: ["مرغوب"] } 
            ] 
          },
          { 
            id: 2, title: "القطعة الثانية", 
            passage: "«قال الأستاذ أحمد أمين: بلغني مرض صديقي، فلم أدركه إلا جنازة، فشيعته إلى أن أُنزل حفرته، ونُفضتْ من ترابه الأيدى ، وعدتُ موجع القلب باكيًا مكروب النفس، وقد أخذنى من الحزن عليه ما تنشق له المرائر».", 
            questions: [ 
              { id: 'q1', type: 'mcq', text: "(أ) كلمة «الأيدى» تعرب:", options: ["مفعولًا به", "فاعلًا مرفوعًا", "نعتًا مرفوعًا", "نائب فاعل"], correctAnswer: "نائب فاعل" }, 
              { id: 'q2', type: 'text', text: "(ب) استخرج من الفقرة: اسمًا للفاعل واسمًا للتفضيل.", correctAnswers: ["موجع", "باكيا", "أعمق"] }, 
              { id: 'q3', type: 'mcq', text: "(جـ) ضع علامة صح أو خطأ: كلمة (مظهرًا) اسم فاعل.", options: ["صح", "خطأ"], correctAnswer: "خطأ" }, 
              { id: 'q4', type: 'text', text: "(د) اكتب فعل الاسم المشتق: مكروب النفس.", correctAnswers: ["كرب", "كُرِبَ"] } 
            ] 
          },
          { 
            id: 3, title: "القطعة الثالثة", 
            passage: "«نقول لأبواق الكذب، وملفقى التُّهم، وبائعي الأباطيل : إن شعب مصر فى حالة من الاصطفاف خلف قيادته، فهو لا يفرط فى مقدراته، ولا يقبل المساس بأمنه، فلا أغلى من وطن يعيش فى القلوب، والشدائد محك الرجال».", 
            questions: [ 
              { id: 'q1', type: 'mcq', text: "(أ) اسم الفاعل من الفعل الثلاثى فى الفقرة:", options: ["المساس", "ملفقى", "بائعى", "أغلى"], correctAnswer: "بائعى" }, 
              { id: 'q2', type: 'text', text: "(ب) أعرب ما تحته خط: قيادته - المساس", correctAnswers: ["مضاف", "مفعول"] }, 
              { id: 'q3', type: 'mcq', text: "(جـ) صح أم خطأ: اسم الآلة السماعى فى الفقرة (أبواق).", options: ["صح", "خطأ"], correctAnswer: "صح" }, 
              { id: 'q4', type: 'text', text: "(د) الأمة عند مفترق الطرق. حدد نوع المشتق: مفترق.", correctAnswers: ["مكان"] } 
            ] 
          },
          { 
            id: 4, title: "القطعة الرابعة", 
            passage: "«الطموح قيمة إيجابية تدفع الشباب إلى الإبداع والتميز، فهو مفتاح النجاح، ولتعلموا أن طريق المستقبل مليء بالتحديات والصعوبات، وعليكم أن تسلكوه متسلحين بالإرادة الحسنى».", 
            questions: [ 
              { id: 'q1', type: 'mcq', text: "(أ) «متسلحين» إعرابها:", options: ["فاعل", "خبر", "حال", "نعت"], correctAnswer: "حال" }, 
              { id: 'q2', type: 'text', text: "(ب) استخرج من الفقرة: اسم آلة، وبيّن نوعه.", correctAnswers: ["مفتاح", "قياسي", "مشتق"] }, 
              { id: 'q3', type: 'mcq', text: "(جـ) «المعلم شادّ عزيمة طلابه». ما تحته خط مشتق نوعه:", options: ["اسم فاعل", "اسم مفعول", "صيغة مبالغة", "اسم آلة"], correctAnswer: "اسم فاعل" }, 
              { id: 'q4', type: 'text', text: "(هـ) استخرج اسم تفضيل، وبين فعله.", correctAnswers: ["الحسنى", "حسن"] } 
            ] 
          },
          { 
            id: 5, title: "القطعة الخامسة", 
            passage: "«ينبغى أن نكون على حذر من انتشار التنمر؛ لأنه من السلوكيات الهدامة فى المجتمع، فإن من يفعل ذلك ملوم؛ لما يسببه من أذى نفسى لغيره؛ فيجب علينا معاقبة المتنمر حتى لا نكون من الآثمين».", 
            questions: [ 
              { id: 'q1', type: 'mcq', text: "(أ) 1- «معاقبة» إعرابها:", options: ["مفعول به منصوب", "فاعل مرفوع", "مضاف إليه مجرور", "نائب فاعل مرفوع"], correctAnswer: "فاعل مرفوع" }, 
              { id: 'q2', type: 'text', text: "(أ) 2- استخرج: صيغة مبالغة واذكر وزنها.", correctAnswers: ["الهدامة", "فعالة"] }, 
              { id: 'q3', type: 'mcq', text: "(ب) كلمة «ملوم» فعلها:", options: ["لام", "يُلَوَّم", "لُوِّم", "لِيم"], correctAnswer: "لِيم" } 
            ] 
          }
        ];

        const App = () => {
            const [studentInfo, setStudentInfo] = useState({ name: '', class: '' });
            const [view, setView] = useState('login'); 
            const [selectedTestId, setSelectedTestId] = useState(null);
            const [answers, setAnswers] = useState({});
            const [lockedAnswers, setLockedAnswers] = useState({});
            const [loading, setLoading] = useState(false);
            const [allResults, setAllResults] = useState([]);
            const [selectedResultDetail, setSelectedResultDetail] = useState(null); 

            const currentTest = selectedTestId ? grammarTests.find(t => t.id === selectedTestId) : null;

            // جلب النتائج من التخزين المحلي أو فايربيز
            useEffect(() => {
                if (view === 'teacher') {
                    if (db) {
                        const unsubscribe = db.collection('student_results').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                            setAllResults(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        });
                        return () => unsubscribe();
                    } else {
                        const localResults = JSON.parse(localStorage.getItem('grammar_results') || '[]');
                        localResults.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                        setAllResults(localResults);
                    }
                }
            }, [view]);

            const handleAnswerChange = (qId, value) => {
                if (lockedAnswers[qId]) return;
                setAnswers(prev => ({ ...prev, [qId]: value }));
            };

            const handleLockAnswer = (qId) => {
                if (!answers[qId] || answers[qId].trim() === '') {
                    alert("رجاءً أدخل إجابة قبل التأكيد.");
                    return;
                }
                setLockedAnswers(prev => ({ ...prev, [qId]: true }));
            };

            // ==========================================================
            // 🧹 دالة ذكية لتنظيف وتوحيد الحروف العربية لمراعاة أخطاء الطلاب
            // ==========================================================
            const normalizeArabicText = (text) => {
                if (!text) return "";
                return text
                    .replace(/[\u064B-\u065F\u0670]/g, "") // إزالة التشكيل
                    .replace(/[أإآ]/g, "ا")             // توحيد الألف والهمزات
                    .replace(/ة/g, "ه")                // توحيد التاء المربوطة والهاء
                    .replace(/ى/g, "ي")                // توحيد الياء والألف المقصورة
                    .replace(/ـ/g, "")                 // إزالة التطويل
                    .trim();                           // إزالة المسافات الزائدة
            };

            // ==========================================================
            // 🤖 دالة التصحيح الإلكتروني (مبرمجة داخلياً ومزودة بالمعالج الذكي)
            // ==========================================================
            const evaluateAnswers = () => {
                let correctCount = 0;
                let feedbackArray = [];

                currentTest.questions.forEach(q => {
                    const studentAns = (answers[q.id] || "").trim();
                    const normalizedStudentAns = normalizeArabicText(studentAns); // تنظيف إجابة الطالب
                    let isCorrect = false;
                    let correctAnsDisplay = "";

                    if (q.type === 'mcq') {
                        // أسئلة الاختيار من متعدد (تطابق تام)
                        isCorrect = (studentAns === q.correctAnswer);
                        correctAnsDisplay = q.correctAnswer;
                    } else {
                        // الأسئلة المقالية (مطابقة ذكية مرنة)
                        isCorrect = q.correctAnswers.some(keyword => {
                            const normalizedKeyword = normalizeArabicText(keyword); // تنظيف الإجابة النموذجية
                            // نبحث عما إذا كانت إجابة الطالب (بعد التنظيف) تحتوي على الكلمة المفتاحية (بعد التنظيف)
                            return normalizedStudentAns.includes(normalizedKeyword);
                        });
                        correctAnsDisplay = q.correctAnswers.join(" أو ");
                    }

                    if (isCorrect) correctCount++;

                    feedbackArray.push({
                        text: q.text,
                        studentAnswer: studentAns || "لم يجب",
                        isCorrect: isCorrect,
                        correctAnswer: correctAnsDisplay,
                        comment: isCorrect ? "إجابة صحيحة، أحسنت!" : "إجابة غير مطابقة للنموذج."
                    });
                });

                // حساب الدرجة من 10
                const score = Math.round((correctCount / currentTest.questions.length) * 10);
                
                return {
                    score: score,
                    feedback: feedbackArray,
                    generalComment: score >= 5 ? "عمل رائع ومجهود طيب!" : "تحتاج إلى المزيد من المراجعة والتركيز."
                };
            };

            const handleSubmit = async () => {
                setLoading(true);

                // استدعاء دالة التصحيح الإلكتروني المبرمجة
                const result = evaluateAnswers();
                
                const resultData = {
                    id: Date.now().toString(),
                    studentName: studentInfo.name,
                    studentClass: studentInfo.class,
                    testTitle: currentTest.title,
                    score: result.score,
                    feedback: result.feedback, 
                    generalComment: result.generalComment,
                    timestamp: new Date().toISOString()
                };
                
                try {
                    if (db) {
                        await db.collection('student_results').add(resultData);
                    } else {
                        // حفظ النتيجة محلياً لكي يراها المعلم
                        const localResults = JSON.parse(localStorage.getItem('grammar_results') || '[]');
                        localResults.push(resultData);
                        localStorage.setItem('grammar_results', JSON.stringify(localResults));
                    }
                    setView('success');
                } catch (error) {
                    console.error("Save error:", error);
                    alert("حدث خطأ أثناء حفظ النتيجة.");
                } finally {
                    setLoading(false);
                }
            };

            const exportToCSV = () => {
                if (allResults.length === 0) return;
                const headers = ["اسم الطالب", "الفصل", "القطعة", "الدرجة", "التاريخ والوقت"];
                const rows = allResults.map(res => [
                    res.studentName, res.studentClass, res.testTitle, `${res.score}/10`, new Date(res.timestamp).toLocaleString('ar-EG')
                ]);
                let csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `نتائج_الطلاب_${new Date().toLocaleDateString('ar-EG')}.csv`;
                link.click();
            };

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center">
                            <span className="text-6xl inline-block mb-4">📖</span>
                            <h1 className="text-3xl font-black text-slate-800 mb-2">منصة النحو الذكية</h1>
                            <p className="text-slate-500 font-medium mb-6">سجل بياناتك للبدء في حل القطع النحوية</p>
                            
                            <div className="space-y-4">
                                <input type="text" placeholder="الاسم الثلاثي" value={studentInfo.name} onChange={(e) => setStudentInfo({...studentInfo, name: e.target.value})} className="w-full p-4 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-500 text-lg"/>
                                <input type="text" placeholder="الفصل" value={studentInfo.class} onChange={(e) => setStudentInfo({...studentInfo, class: e.target.value})} className="w-full p-4 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-500 text-lg"/>
                                <button disabled={!studentInfo.name || !studentInfo.class} onClick={() => setView('select')} className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg disabled:bg-slate-300">التالي ◀️</button>
                                
                                <button onClick={() => setView('teacher')} className="w-full pt-4 mt-4 border-t border-slate-100 text-indigo-600 font-bold text-sm">📋 دخول المعلم (عرض النتائج)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'select') {
                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-800">مرحباً، {studentInfo.name}</h2>
                                    <p className="text-slate-500">اختر القطعة النحوية للبدء بالاختبار (يجب تأكيد كل سؤال)</p>
                                </div>
                                <button onClick={() => setView('login')} className="text-2xl">🚪</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {grammarTests.map(test => (
                                    <button key={test.id} onClick={() => { setSelectedTestId(test.id); setAnswers({}); setLockedAnswers({}); setView('quiz'); }} className="bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl hover:border-indigo-300 text-right border border-slate-200 transition-all">
                                        <h3 className="text-xl font-bold text-indigo-700 mb-2">{test.title}</h3>
                                        <p className="text-slate-600 text-sm leading-relaxed">{test.passage}</p>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'quiz' && currentTest) {
                const allQuestionsLocked = currentTest.questions.every(q => lockedAnswers[q.id]);
                const lockedCount = Object.keys(lockedAnswers).length;
                const totalCount = currentTest.questions.length;

                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                        <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-200">
                            <div className="bg-indigo-600 p-6 text-white flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-black mb-1">{currentTest.title}</h1>
                                    <p className="text-indigo-100 text-sm">تم التأكيد على: {lockedCount}/{totalCount}</p>
                                </div>
                                <button onClick={() => setView('select')} className="bg-white/20 px-4 py-2 rounded-lg">رجوع</button>
                            </div>
                            <div className="p-6 md:p-8 space-y-8">
                                <div className="bg-amber-50 p-6 rounded-2xl border-2 border-amber-200">
                                    <p className="text-xl leading-loose text-slate-800 font-medium">{currentTest.passage}</p>
                                </div>
                                <div className="space-y-6">
                                    {currentTest.questions.map((q) => {
                                        const isLocked = lockedAnswers[q.id];
                                        return (
                                            <section key={q.id} className={`p-6 rounded-2xl border-2 ${isLocked ? 'border-emerald-400 bg-emerald-50' : 'border-slate-200'}`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <label className="text-lg text-slate-800 font-bold">{q.text}</label>
                                                    {isLocked && <span className="text-2xl">✅</span>}
                                                </div>
                                                {q.type === 'mcq' ? (
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                                        {q.options.map(opt => {
                                                            const isSelected = answers[q.id] === opt;
                                                            return (
                                                                <button key={opt} disabled={isLocked} onClick={() => handleAnswerChange(q.id, opt)} className={`p-4 rounded-xl border-2 font-bold text-lg ${isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-100'} ${isLocked && !isSelected ? 'opacity-50 cursor-not-allowed' : ''} ${isLocked && isSelected ? 'border-emerald-500 bg-emerald-100 text-emerald-800' : ''}`}>
                                                                    {opt}
                                                                </button>
                                                            )
                                                        })}
                                                    </div>
                                                ) : (
                                                    <input type="text" disabled={isLocked} placeholder="اكتب إجابتك هنا..." className={`w-full p-4 mb-4 rounded-xl border-2 outline-none text-lg ${isLocked ? 'border-emerald-400 bg-emerald-50 font-bold' : 'border-slate-200 focus:border-indigo-600'}`} value={answers[q.id] || ''} onChange={e => handleAnswerChange(q.id, e.target.value)} />
                                                )}
                                                {!isLocked && (
                                                    <button onClick={() => handleLockAnswer(q.id)} className="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">🔒 تأكيد وقفل الإجابة</button>
                                                )}
                                            </section>
                                        );
                                    })}
                                    <div className="pt-6 border-t border-slate-200">
                                        {!allQuestionsLocked && <p className="text-center text-red-500 font-bold mb-4">⚠️ قم بتأكيد (قفل) جميع الأسئلة لتتمكن من التسليم.</p>}
                                        <button onClick={handleSubmit} disabled={loading || !allQuestionsLocked} className={`w-full py-5 rounded-2xl font-black text-xl shadow-xl transition-all ${allQuestionsLocked && !loading ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                            {loading ? '⏳ جاري التصحيح...' : '🚀 الإنهاء والتسليم للمعلم'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'success') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 text-center">
                        <div className="bg-white p-10 rounded-3xl shadow-xl w-full max-w-lg">
                            <span className="text-6xl inline-block mb-4">✅</span>
                            <h2 className="text-3xl font-black text-slate-800 mb-4">تم تسليم الإجابات!</h2>
                            <p className="text-lg text-slate-600 mb-8 font-medium">تم التصحيح وحفظ النتيجة في سجل المعلم بنجاح.</p>
                            <button onClick={() => setView('login')} className="w-full py-4 bg-slate-800 text-white rounded-xl font-bold">العودة للرئيسية</button>
                        </div>
                    </div>
                );
            }

            if (view === 'teacher') {
                return (
                    <div className="min-h-screen bg-slate-50 p-4 md:p-8">
                        <div className="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="bg-indigo-900 p-8 text-white flex justify-between items-center">
                                <div>
                                    <h2 className="text-3xl font-black">📋 نتائج الطلاب</h2>
                                </div>
                                <button onClick={() => setView('login')} className="bg-white/10 px-6 py-3 rounded-xl font-bold hover:bg-white/20">خروج</button>
                            </div>
                            <div className="p-0 overflow-x-auto">
                                {allResults.length === 0 ? (
                                    <div className="text-center py-20 text-slate-500 font-bold text-xl">لا توجد نتائج مسجلة حتى الآن.</div>
                                ) : (
                                    <table className="w-full text-right border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                                                <th className="p-5">اسم الطالب</th><th className="p-5">الفصل</th><th className="p-5">القطعة</th><th className="p-5">الدرجة</th><th className="p-5 text-center">الإجراءات</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {allResults.map((res, idx) => (
                                                <tr key={idx} className="border-b border-slate-100 hover:bg-indigo-50">
                                                    <td className="p-5 font-bold">{res.studentName}</td><td className="p-5">{res.studentClass}</td><td className="p-5">{res.testTitle}</td>
                                                    <td className="p-5"><span className={`px-4 py-1 rounded-full text-sm font-bold ${res.score >= 5 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{res.score} / 10</span></td>
                                                    <td className="p-5 text-center">
                                                        <button onClick={() => setSelectedResultDetail(res)} className="px-3 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-sm font-bold">التفاصيل</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                            {selectedResultDetail && (
                                <div className="fixed inset-0 bg-slate-900/50 flex justify-center items-center p-4 z-50">
                                    <div className="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl flex flex-col overflow-hidden">
                                        <div className="p-6 border-b flex justify-between bg-indigo-50">
                                            <div><h3 className="text-2xl font-bold">{selectedResultDetail.studentName}</h3><p>الدرجة: {selectedResultDetail.score}/10</p></div>
                                            <button onClick={() => setSelectedResultDetail(null)} className="text-2xl bg-white rounded-full w-8 h-8">✖</button>
                                        </div>
                                        <div className="p-6 overflow-y-auto space-y-4">
                                            {selectedResultDetail.feedback?.map((item, i) => (
                                                <div key={i} className={`p-5 rounded-2xl border ${item.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                                                    <p className="font-bold mb-2">{item.isCorrect ? '✅' : '❌'} {item.text}</p>
                                                    <p className="text-sm"><span className="font-bold">إجابة الطالب:</span> {item.studentAnswer}</p>
                                                    {!item.isCorrect && <p className="text-sm text-emerald-700"><span className="font-bold">الإجابة الصحيحة المقبولة:</span> {item.correctAnswer}</p>}
                                                    <p className="text-sm italic mt-2 text-slate-600">💡 {item.comment}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
